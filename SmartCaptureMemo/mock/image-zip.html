<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像ZIP保存 モック</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --surface2:#eef0f4; --border:#d8dbe2; --text:#1c1f26; --sub:#6b7280;
    --accent:#3b6fe0; --ok:#1f9d5c; --secondary-bg:#e7e9ee; --danger:#d14343; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --panel:#171a21; --surface2:#1c2029; --border:#2a2e3a; --text:#e6e8ec; --sub:#9aa0ac;
      --accent:#4f8cff; --ok:#2fbf71; --secondary-bg:#262b38; --danger:#ff6b6b; color-scheme:dark; }
  }
  html[data-theme="light"]{color-scheme:light; --bg:#f5f6f8; --panel:#ffffff; --surface2:#eef0f4; --border:#d8dbe2; --text:#1c1f26; --sub:#6b7280; --accent:#3b6fe0; --ok:#1f9d5c; --secondary-bg:#e7e9ee; --danger:#d14343;}
  html[data-theme="dark"]{color-scheme:dark; --bg:#0f1115; --panel:#171a21; --surface2:#1c2029; --border:#2a2e3a; --text:#e6e8ec; --sub:#9aa0ac; --accent:#4f8cff; --ok:#2fbf71; --secondary-bg:#262b38; --danger:#ff6b6b;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text);}
  header{padding:12px 120px 12px 16px; border-bottom:1px solid var(--border); position:relative;}
  header h1{font-size:15px; margin:0;} header p{margin:4px 0 0; font-size:12px; color:var(--sub);}
  .themeBtn{position:absolute; right:16px; top:12px; height:32px;}
  main{max-width:900px; margin:0 auto; padding:14px 16px;}
  button{height:36px; border:none; border-radius:8px; padding:0 12px; font-size:13px; cursor:pointer; font-family:inherit; background:var(--secondary-bg); color:var(--text);}
  .ok{background:var(--ok); color:#fff;}
  input{height:36px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:0 10px; font-size:13px; font-family:inherit;}
  .row{display:flex; gap:8px; align-items:center;}
  #title{flex:1; min-width:0;}
  .moreWrap{position:relative;}
  #moreMenu{position:absolute; right:0; top:calc(100% + 4px); z-index:10; background:var(--panel); border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.2); padding:4px; min-width:230px; display:flex; flex-direction:column;}
  #moreMenu[hidden]{display:none;}
  #moreMenu button{background:transparent; justify-content:flex-start; display:flex; align-items:center; text-align:left; width:100%;}
  #moreMenu button:hover{background:var(--surface2);}
  #moreMenu .new{font-weight:700;}
  #moreMenu .new::after{content:"NEW"; font-size:9px; color:#fff; background:var(--accent); border-radius:6px; padding:1px 5px; margin-left:auto;}
  #moreMenu .dangerItem{color:var(--danger);}
  #moreMenu hr{border:none; border-top:1px solid var(--border); margin:4px 2px;}
  .note{font-size:12px; color:var(--sub); line-height:1.7; margin:10px 0 14px;}
  .list{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:6px 12px;}
  .item{display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .item:last-child{border-bottom:none;}
  .item img{width:120px; border-radius:6px; border:1px solid var(--border);}
  .head{font-weight:700; padding:10px 0 6px; border-bottom:1px solid var(--border);}
  .memo{color:var(--sub);}
  #result{margin-top:14px; font-size:12px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; white-space:pre-wrap;}
  #result[hidden]{display:none;}
  .toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:13px;}
  .toast[hidden]{display:none;}
</style>
</head>
<body>
<header>
  <button class="themeBtn" id="btnTheme" type="button"></button>
  <h1>キャプチャ画像のZIP保存(モック)</h1>
  <p>動作確認用のモックです。本体には未反映。⋯ メニューから実際にZIPをダウンロードできます(サンプル画像)。</p>
</header>
<main>
  <div class="row">
    <input type="date" id="date">
    <input type="text" id="title" value="定例_週次_設計">
    <button class="ok" type="button">💾 HTML保存</button>
    <div class="moreWrap">
      <button id="btnMore" type="button">⋯</button>
      <div id="moreMenu" hidden>
        <button type="button" disabled>📥 HTMLを読み込む</button>
        <button type="button" class="new" id="btnZip">🖼 画像をZIPで保存</button>
        <button type="button" disabled>🔄 一覧を更新</button>
        <hr>
        <button type="button" class="dangerItem" disabled>🗑 全削除</button>
      </div>
    </div>
  </div>
  <div class="note">
    <b>仕様(案)</b><br>
    ・⋯ →「🖼 画像をZIPで保存」で、記録一覧のキャプチャ画像をまとめて1つのZIPでダウンロード(メモ・見出しは含めない)<br>
    ・ZIPの名前: HTML保存と同じ名前 + 「_画像」(例: <code>2026-1124_定例_週次_設計_画像.zip</code>)<br>
    ・画像の名前: <code>番号_見出し名.jpg</code>(番号は一覧の並び順の2桁連番。見出しより前の画像は <code>番号.jpg</code>)<br>
    ・画像は記録時のまま(JPEG・トリミング後の状態)
  </div>
  <div class="list" id="list"></div>
  <div id="result" hidden></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const p2 = (n) => String(n).padStart(2, "0");

  // ---------- サンプルの記録一覧(画像はcanvasで生成) ----------
  function makeImg(label, hue){
    const c = document.createElement("canvas"); c.width = 640; c.height = 360; const g = c.getContext("2d");
    g.fillStyle = `hsl(${hue},50%,45%)`; g.fillRect(0, 0, 640, 360);
    g.fillStyle = "#fff"; g.font = "bold 36px sans-serif"; g.fillText(label, 30, 80);
    g.font = "22px sans-serif"; g.fillText("サンプル画面", 30, 130);
    return c.toDataURL("image/jpeg", 0.85);
  }
  const records = [
    { d: makeImg("開始前の画面", 210) },
    { h: true, m: "前回の振り返り" },
    { d: makeImg("振り返り 1", 140), m: "アクション5件中4件完了" },
    { d: makeImg("振り返り 2", 160) },
    { h: true, m: "進捗報告" },
    { d: makeImg("進捗 1", 20), m: "設計80%" },
    { h: false, m: "ここはメモ(画像なし)" },
    { d: makeImg("進捗 2", 40) },
    { h: true, m: "課題/対策:納期" },
    { d: makeImg("課題 1", 330) }
  ];
  $("list").innerHTML = records.map((r) => r.d
    ? `<div class="item"><img src="${r.d}"><span class="memo">${r.m || ""}</span></div>`
    : `<div class="${r.h ? "head" : "item memo"}">${r.h ? "📝 " : "💬 "}${r.m}</div>`).join("");

  // ---------- ZIP(無圧縮)を外部ライブラリなしで作る ----------
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
  function crc32(buf){ let c = 0xFFFFFFFF; for(let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function makeZip(files){ // files: [{ name, data: Uint8Array }]
    const enc = new TextEncoder(), parts = [], central = [];
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    let offset = 0;
    files.forEach((f) => {
      const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); // UTF-8のファイル名
      lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + size;
    });
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: "application/zip" });
  }
  function dataURLToBytes(url){ const bin = atob(url.split(",")[1]); const a = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  const safe = (t) => String(t).replace(/[\\/:*?"<>|\r\n]/g, "").trim().slice(0, 40);

  // ---------- 画像をZIPで保存 ----------
  $("btnZip").addEventListener("click", () => {
    $("moreMenu").hidden = true;
    let heading = "", n = 0;
    const files = [];
    records.forEach((r) => {
      if(!r.d){ if(r.h) heading = safe(r.m); return; }
      n++;
      files.push({ name: `${p2(n)}${heading ? "_" + heading : ""}.jpg`, data: dataURLToBytes(r.d) });
    });
    if(!files.length){ toast("保存できる画像がありません"); return; }
    const [y, m, d] = ($("date").value || "").split("-");
    const base = safe($("title").value) || "SmartCaptureMemo";
    const zipName = (y ? `${y}-${m}${d}_` : "") + base + "_画像.zip";
    const url = URL.createObjectURL(makeZip(files));
    const a = document.createElement("a"); a.href = url; a.download = zipName; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast(`🖼 ${files.length}枚の画像をZIPで保存しました: ${zipName}`);
    $("result").hidden = false;
    $("result").textContent = `${zipName}\n` + files.map((f) => `  └ ${f.name}`).join("\n");
  });

  let toastTimer = null;
  function toast(t){ $("toast").textContent = t; $("toast").hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; }, 3000); }
  $("btnMore").addEventListener("click", (e) => { e.stopPropagation(); $("moreMenu").hidden = !$("moreMenu").hidden; });
  document.addEventListener("click", (e) => { if(!e.target.closest(".moreWrap")) $("moreMenu").hidden = true; });
  $("date").value = new Date().toISOString().slice(0, 10);

  const sysTheme = () => matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const themeLabel = () => { const t = document.documentElement.dataset.theme || sysTheme(); $("btnTheme").textContent = t === "dark" ? "☀ ライト" : "🌙 ダーク"; };
  $("btnTheme").addEventListener("click", () => { const t = document.documentElement.dataset.theme || sysTheme(); document.documentElement.dataset.theme = t === "dark" ? "light" : "dark"; themeLabel(); });
  themeLabel();
})();
</script>
</body>
</html>
