<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイトル整理 モック</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --surface2:#eef0f4; --border:#d8dbe2; --text:#1c1f26; --sub:#6b7280;
    --accent:#3b6fe0; --ok:#1f9d5c; --warn:#b45309; --secondary-bg:#e7e9ee; --star:#d97706; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --panel:#171a21; --surface2:#1c2029; --border:#2a2e3a; --text:#e6e8ec; --sub:#9aa0ac;
      --accent:#4f8cff; --ok:#2fbf71; --warn:#f0a03c; --secondary-bg:#262b38; --star:#f0a03c; color-scheme:dark; }
  }
  html[data-theme="light"]{color-scheme:light; --bg:#f5f6f8; --panel:#ffffff; --surface2:#eef0f4; --border:#d8dbe2; --text:#1c1f26; --sub:#6b7280;
    --accent:#3b6fe0; --ok:#1f9d5c; --warn:#b45309; --secondary-bg:#e7e9ee; --star:#d97706;}
  html[data-theme="dark"]{color-scheme:dark; --bg:#0f1115; --panel:#171a21; --surface2:#1c2029; --border:#2a2e3a; --text:#e6e8ec; --sub:#9aa0ac;
    --accent:#4f8cff; --ok:#2fbf71; --warn:#f0a03c; --secondary-bg:#262b38; --star:#f0a03c;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text);}
  header{padding:12px 120px 12px 16px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:5;}
  header h1{font-size:15px; margin:0;}
  header p{margin:4px 0 0; font-size:12px; color:var(--sub);}
  .themeBtn{position:absolute; right:16px; top:12px; height:32px;}
  main{max-width:900px; margin:0 auto; padding:14px 16px;}
  button{height:36px; border:none; border-radius:8px; padding:0 12px; font-size:13px; cursor:pointer; font-family:inherit; background:var(--secondary-bg); color:var(--text);}
  input[type=text]{height:36px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:0 10px; font-size:13px; font-family:inherit;}
  .chips{display:flex; gap:8px; margin-bottom:10px;}
  .chip{height:34px; border-radius:17px; background:transparent; border:1px solid var(--border);}
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .row{display:flex; gap:8px; align-items:center;}
  #search{flex:1; min-width:0;}
  .sub{font-size:12px; color:var(--sub);}
  /* 定番タイトル・整理パネル */
  #orgToggle{width:100%; margin-top:8px; justify-content:space-between; display:flex; align-items:center; background:var(--panel); border:1px solid var(--border);}
  #orgToggle .arrow{color:var(--sub);}
  #org{border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; background:var(--panel); padding:8px;}
  #org[hidden]{display:none;}
  #orgToggle.open{border-radius:8px 8px 0 0;}
  .cols{display:grid; grid-template-columns:repeat(3, minmax(150px, 1fr)); border:1px solid var(--border); border-radius:8px; overflow-x:auto;}
  .col{border-right:1px solid var(--border); min-width:150px;}
  .col:last-child{border-right:none;}
  .colHead{font-size:11px; color:var(--sub); padding:6px 10px; background:var(--surface2); border-bottom:1px solid var(--border); white-space:nowrap;}
  .colList{list-style:none; margin:0; padding:2px 0; max-height:calc(32px * 6 + 4px); overflow-y:auto;}
  .colList li{height:32px; display:flex; align-items:center; gap:6px; padding:0 6px 0 4px; cursor:pointer; font-size:13px;}
  .colList li:hover{background:var(--surface2);}
  .colList li.sel{background:color-mix(in srgb, var(--accent) 16%, transparent); box-shadow:inset 3px 0 0 var(--accent);}
  .colList li .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .colList li .more{color:var(--sub); font-size:12px;}
  .colList .empty{font-size:12px; color:var(--sub); padding:8px 10px; cursor:default;}
  .star{background:none; height:24px; width:24px; padding:0; font-size:15px; color:var(--sub); flex:none;}
  .star.on{color:var(--star);}
  .orgFoot{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .orgFoot .path{font-weight:600;}
  .hint{margin:8px 0 10px; font-size:12px; color:var(--sub);}
  /* 履歴一覧 */
  #hist{list-style:none; margin:0; padding:0; background:var(--panel); border:1px solid var(--border); border-radius:8px;}
  #hist li{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--border); font-size:13px; min-height:44px;}
  #hist li:last-child{border-bottom:none;}
  #hist .time{color:var(--accent); font-family:ui-monospace,monospace; font-size:12px; white-space:nowrap;}
  #hist .fn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #hist .renamed{color:var(--sub); font-size:11px; margin-left:6px;}
  #hist .mini{height:28px; padding:0 9px; font-size:12px;}
  #hist input{flex:1; min-width:0; height:30px;}
  #hist .empty{color:var(--sub); justify-content:center;}
  .filterNote{font-size:12px; color:var(--accent); margin:0 0 6px;}
  .filterNote button{height:22px; font-size:11px; padding:0 8px; margin-left:6px;}
</style>
</head>
<body>
<header>
  <button class="themeBtn" id="btnTheme" type="button"></button>
  <h1>履歴タブ:定番タイトル・タイトル整理(モック)</h1>
  <p>動作確認用のモックです。本体には未反映。サンプルの履歴は「リネーム テスト用サンプル」と同じ名前です(このページを閉じると元に戻ります)。</p>
</header>
<main>
  <div class="chips"><button class="chip">今日</button><button class="chip">今週</button><button class="chip">先週</button><button class="chip">今月</button><button class="chip on">すべて</button></div>
  <div class="row">
    <input type="text" id="search" placeholder="ファイル名で検索">
    <button type="button" title="同期">🔄</button><button type="button">📋 パスをコピー</button><button type="button">📂 フォルダから追加</button>
  </div>

  <button id="orgToggle" type="button"><span>★ 定番タイトル・タイトル整理</span><span class="arrow" id="orgArrow">▸ 開く</span></button>
  <div id="org" hidden>
    <div class="cols">
      <div class="col"><div class="colHead">大項目</div><ul class="colList" id="c0"></ul></div>
      <div class="col"><div class="colHead">中項目</div><ul class="colList" id="c1"></ul></div>
      <div class="col"><div class="colHead">小項目</div><ul class="colList" id="c2"></ul></div>
    </div>
    <div class="orgFoot sub">
      <span>選択中: <span class="path" id="selPath">—</span></span>
      <span>・項目を選ぶと下の履歴を絞り込み、✏ でそのままリネームできます</span>
      <span>・☆で定番に登録(入力候補の上位に表示)</span>
    </div>
  </div>
  <p class="hint">⚙設定で保存先フォルダを登録すると、履歴からファイルを開く・読み込みができます</p>

  <p class="filterNote" id="filterNote" hidden></p>
  <ul id="hist"></ul>
</main>

<script>
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  // サンプル履歴(テスト用zipと同じ)
  let hist = [
    ["2026-11-17","DD_月例_全体"], ["2026-11-12","設備生産 定例 衛生"], ["2026-11-10","Mtg設備_社内勉強会"], ["2026-11-05","設備生産設計_定例_空調"],
    ["2026-10-27","dd_週次_構造"], ["2026-10-23","設備コンサル_P1_UC"], ["2026-10-20","DD_週次BIM"], ["2026-10-16","P1_UC"],
    ["2026-10-13","DD_週次_BIM"], ["2026-10-09","設備コンサル_ユースケース"], ["2026-10-06","DD週次_BIM"], ["2026-10-02","設備コンサルP1_UC"]
  ].map(([date, title], i) => ({ id: i, date, title, oldNames: [] }));
  let favorites = ["DD_週次"];        // 定番(途中までの登録も可)
  let sel = [];                       // 選択中のパス(例: ["DD","週次"])
  let editingId = null;

  const segs = (t) => { const p = t.split("_"); return p.length > 3 ? [p[0], p[1], p.slice(2).join("_")] : p; };
  const fileName = (h) => `${h.date.slice(0, 4)}-${h.date.slice(5, 7)}${h.date.slice(8, 10)}_${h.title}.html`;
  const pathStr = (p) => p.join("_");
  const isFav = (p) => favorites.includes(pathStr(p));

  // ---------- カラムビュー ----------
  function colItems(level){
    const prefix = sel.slice(0, level);
    const map = new Map(); // 値 → 下の階層があるか
    hist.forEach((h) => {
      const s = segs(h.title);
      if(s.length <= level) return;
      for(let i = 0; i < level; i++){ if(s[i] !== prefix[i]) return; }
      map.set(s[level], (map.get(s[level]) || false) || s.length > level + 1);
    });
    favorites.forEach((f) => { // 定番だけに有る項目も表示
      const s = segs(f); if(s.length <= level) return;
      for(let i = 0; i < level; i++){ if(s[i] !== prefix[i]) return; }
      if(!map.has(s[level])) map.set(s[level], s.length > level + 1);
    });
    return Array.from(map.entries()).map(([v, hasChild]) => ({ v, hasChild, fav: isFav([...prefix, v]) }))
      .sort((a, b) => (b.fav - a.fav) || a.v.localeCompare(b.v, "ja"));
  }

  function renderCols(){
    [0, 1, 2].forEach((level) => {
      const ul = $("c" + level);
      if(level > sel.length){ ul.innerHTML = ""; return; }
      const items = colItems(level);
      ul.innerHTML = items.length ? items.map((it) => `
        <li data-level="${level}" data-v="${esc(it.v)}" class="${sel[level] === it.v ? "sel" : ""}">
          <button class="star ${it.fav ? "on" : ""}" data-star type="button" title="${it.fav ? "定番から外す" : "定番に登録"}">${it.fav ? "★" : "☆"}</button>
          <span class="nm">${esc(it.v)}</span>${it.hasChild ? '<span class="more">›</span>' : ""}
        </li>`).join("") : `<li class="empty">${level === 0 ? "履歴がありません" : "(この下の項目なし)"}</li>`;
    });
    $("selPath").textContent = sel.length ? pathStr(sel) + (sel.length < 3 && colItems(sel.length).length ? "_…" : "") : "—";
  }

  document.querySelector(".cols").addEventListener("click", (e) => {
    const li = e.target.closest("li[data-level]"); if(!li) return;
    const level = Number(li.dataset.level), v = li.dataset.v;
    if(e.target.closest("[data-star]")){
      const p = pathStr([...sel.slice(0, level), v]);
      favorites = favorites.includes(p) ? favorites.filter((x) => x !== p) : [...favorites, p];
      renderCols(); return;
    }
    sel = sel[level] === v && sel.length === level + 1 ? sel.slice(0, level) : [...sel.slice(0, level), v]; // 同じ項目をもう一度押すと選択解除
    renderCols(); renderHist();
  });

  $("orgToggle").addEventListener("click", () => {
    const open = $("org").hidden;
    $("org").hidden = !open; $("orgToggle").classList.toggle("open", open);
    $("orgArrow").textContent = open ? "▾ 閉じる" : "▸ 開く";
    if(!open){ sel = []; renderHist(); }
    renderCols();
  });

  // ---------- 履歴一覧 ----------
  function matchesSel(h){
    const s = segs(h.title);
    return sel.every((v, i) => s[i] === v);
  }
  function renderHist(){
    const q = $("search").value.trim().toLowerCase();
    const items = hist.filter((h) => matchesSel(h) && (!q || fileName(h).toLowerCase().includes(q))).sort((a, b) => b.date.localeCompare(a.date));
    $("filterNote").hidden = !sel.length;
    $("filterNote").innerHTML = sel.length ? `「${esc(pathStr(sel))}」で絞り込み中(${items.length}件)<button type="button" id="clearSel">解除</button>` : "";
    $("hist").innerHTML = items.length ? items.map((h) => {
      if(h.id === editingId){
        return `<li data-id="${h.id}"><span class="time">${h.date.replace(/-/g, "/")}</span><input type="text" value="${esc(h.title)}" id="editIn"><button class="mini" data-act="ok" type="button">変更</button><button class="mini" data-act="cancel" type="button">取消</button></li>`;
      }
      const old = h.oldNames.length ? `<span class="renamed" title="旧名: ${esc(h.oldNames.join(" → "))}">✏ 旧名あり</span>` : "";
      return `<li data-id="${h.id}"><span class="time">${h.date.replace(/-/g, "/")}</span><span class="fn">${esc(fileName(h))}${old}</span>
        <button class="mini" data-act="edit" type="button" title="名前を変更">✏</button><button class="mini" type="button">📄</button><button class="mini" type="button">📥</button></li>`;
    }).join("") : '<li class="empty">条件に合う履歴がありません</li>';
    const ed = $("editIn"); if(ed){ ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
  }
  function commitEdit(){
    const h = hist.find((x) => x.id === editingId); const v = $("editIn").value.replace(/_+$/, "").trim();
    if(v && v !== h.title){ h.oldNames.push(h.title); h.title = v; }
    editingId = null;
    while(sel.length && !hist.some(matchesSel)) sel.pop(); // 絞り込み先が無くなったら1つ上の階層へ
    renderCols(); renderHist();
  }
  $("hist").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const id = Number(b.closest("li").dataset.id);
    if(b.dataset.act === "edit"){ editingId = id; renderHist(); }
    else if(b.dataset.act === "cancel"){ editingId = null; renderHist(); }
    else if(b.dataset.act === "ok"){ commitEdit(); }
  });
  $("hist").addEventListener("keydown", (e) => {
    if(e.target.id !== "editIn") return;
    if(e.key === "Enter"){ e.preventDefault(); commitEdit(); }
    else if(e.key === "Escape"){ editingId = null; renderHist(); }
  });
  document.addEventListener("click", (e) => { if(e.target.id === "clearSel"){ sel = []; renderCols(); renderHist(); } });
  $("search").addEventListener("input", renderHist);

  // ---------- テーマ ----------
  const sysTheme = () => matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const themeLabel = () => { const t = document.documentElement.dataset.theme || sysTheme(); $("btnTheme").textContent = t === "dark" ? "☀ ライト" : "🌙 ダーク"; };
  $("btnTheme").addEventListener("click", () => { const t = document.documentElement.dataset.theme || sysTheme(); document.documentElement.dataset.theme = t === "dark" ? "light" : "dark"; themeLabel(); });
  themeLabel();

  renderCols(); renderHist();
})();
</script>
</body>
</html>
