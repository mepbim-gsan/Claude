<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CarLog</title>
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" id="fav-svg">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" id="fav-png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" id="apple-icon">
<script type="module">
// Firebase（Googleログイン＋Firestore同期）。未設定・未ログインでも端末内保存で動作する
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CONFIG_KEY = 'firebase-config-v1';   // 同一サイトの他ツールと共通
const FIRESTORE_DOC = 'carlog-main';
const C = window._cloud = { configured:false, projectId:'', user:null, status:'', push(){}, login(){}, logout(){} };
const refresh = () => window.renderCloud && window.renderCloud();
const setStatus = t => { C.status = t; refresh(); };

let cfg = null;
try { cfg = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); } catch {}
if (cfg && cfg.apiKey) {
  try { start(cfg); } catch (e) { console.error(e); setStatus('Firebase の初期化に失敗しました'); }
}
refresh();

function start(cfg) {
  const app = initializeApp(cfg), auth = getAuth(app), db = getFirestore(app);
  C.configured = true; C.projectId = cfg.projectId || '';
  let ref = null, unsub = null, lastJson = null, timer = null;

  C.login = async () => {
    try {
      const pv = new GoogleAuthProvider(); pv.setCustomParameters({ prompt:'select_account' });
      await signInWithPopup(auth, pv);
    } catch (e) { console.error(e); setStatus('ログインエラー: ' + (e.code || e.message)); }
  };
  C.logout = async () => { await signOut(auth); };
  const write = async json => {
    lastJson = json;
    setStatus('保存中…');
    try { await setDoc(ref, { json, updatedAt: Date.now() }); setStatus('同期済み'); }
    catch (e) { console.error(e); setStatus('保存エラー: ' + (e.code || e.message)); }
  };
  C.push = () => {
    if (!ref) return;
    clearTimeout(timer);
    timer = setTimeout(() => { const j = window.cloudJson(); if (j !== lastJson) write(j); }, 800);
  };

  onAuthStateChanged(auth, async user => {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { C.user = null; ref = null; lastJson = null; setStatus(''); return; }
    C.user = { name: user.displayName || '', email: user.email || '' };
    ref = doc(db, 'users', user.uid, 'data', FIRESTORE_DOC);
    setStatus('同期を確認中…');
    try {
      const snap = await getDoc(ref);
      const local = window.cloudJson();
      if (!snap.exists()) {
        await write(local);                      // 初回：この端末のデータをアップロード
      } else {
        const remote = snap.data().json;
        const dirty = !!localStorage.getItem('carlog-dirty');
        if (dirty && remote !== local) {
          const choice = await window.askSyncChoice();
          if (choice === 'cancel') { await signOut(auth); return; }
          if (choice === 'local') await write(local);
          else { lastJson = remote; window.applyCloudJson(remote); }
        } else if (remote !== local) { lastJson = remote; window.applyCloudJson(remote); }
        else lastJson = remote;
      }
      localStorage.removeItem('carlog-dirty');
      setStatus('同期済み');
      unsub = onSnapshot(ref, s => {
        if (s.metadata.hasPendingWrites || !s.exists()) return;
        const j = s.data().json;
        if (j && j !== lastJson) { lastJson = j; window.applyCloudJson(j); setStatus('同期済み'); }
      }, e => { console.error(e); setStatus('同期エラー: ' + (e.code || e.message)); });
    } catch (e) { console.error(e); setStatus('同期エラー: ' + (e.code || e.message)); }
  });
}
</script>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#242736;--border:#2e3247;
  --accent:#4f8ef7;--success:#3ecf8e;--warn:#f5a623;--danger:#e05252;
  --text:#e8eaf0;--text2:#8b90a7;--text3:#5a5f7a;
  --c-fuel:#4f8ef7;--c-maint:#3ecf8e;--c-cost:#f5a623;--c-init:#a78bfa;
  --nav-h:60px;--radius:12px;
}
[data-theme="light"]{
  --bg:#f4f6fb;--bg2:#ffffff;--bg3:#eef0f7;--border:#d0d5e8;
  --accent:#2563eb;--success:#16a34a;--warn:#d97706;--danger:#dc2626;
  --text:#1e2233;--text2:#6b7280;--text3:#9ca3af;
  --c-fuel:#2563eb;--c-maint:#16a34a;--c-cost:#d97706;--c-init:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scrollbar-gutter:stable;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;}
button{font-family:inherit;}
#header{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:10px 14px;}
#header .h-title{font-size:16px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#header .h-sub{font-size:11px;color:var(--text2);font-weight:400;margin-left:6px;}
.app-ver{font-size:10px;color:var(--text3);}
.icon-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;}
#app{padding-bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;}   /* 最後の行が ＋ボタンに隠れないように */
#maint-filter,#cost-filter{position:sticky;top:var(--hdr-h,55px);z-index:40;background:var(--bg);margin:0 -14px 6px;padding:8px 14px;}
.row.dim{opacity:.4;}
.r-int{font-size:11px;color:var(--accent);margin-top:2px;}
#nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:22px;height:22px;}
.page{display:none;padding:14px;}
.page.active{display:block;}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.page-title{font-size:18px;font-weight:700;}
.year-sel{width:auto;padding:6px 10px;font-size:14px;}
.year-nav{display:flex;align-items:center;gap:6px;}
.yn-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex-shrink:0;}
.yn-btn:disabled{opacity:.35;cursor:default;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.08em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:560px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi{background:var(--bg3);border-radius:10px;padding:10px;}
.kpi .k-label{font-size:11px;color:var(--text2);}
.kpi .k-val{font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap;}
.kpi .k-unit{font-size:11px;color:var(--text2);font-weight:400;margin-left:2px;}
.kpi .k-sub{font-size:10px;color:var(--text3);margin-top:2px;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .k-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .k-val,.kpi .k-sub{text-align:right;}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px;padding:9px 12px;width:100%;outline:none;font-family:inherit;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input[inputmode=numeric],input[inputmode=decimal]{text-align:right;}
textarea{resize:vertical;min-height:60px;}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent;}
.btn.sm{padding:5px 10px;font-size:12px;}
.list{display:flex;flex-direction:column;}
.list-month{font-size:12px;color:var(--text2);font-weight:600;padding:10px 2px 6px;display:flex;justify-content:space-between;}
.row{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;gap:10px;align-items:center;}
.row:active{background:var(--bg3);}
.row .r-date{font-size:12px;color:var(--text2);width:38px;text-align:center;flex-shrink:0;line-height:1.2;}
.row .r-date b{display:block;font-size:17px;color:var(--text);}
.row .r-main{flex:1;min-width:0;}
.row .r-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .r-sub{font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .r-right{text-align:right;flex-shrink:0;}
.row .r-amt{font-size:15px;font-weight:700;}
.row .r-amt2{font-size:11px;color:var(--text2);margin-top:2px;}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);margin-right:4px;vertical-align:1px;}
.badge.fuel{color:var(--c-fuel);border-color:var(--c-fuel);}
.badge.maint{color:var(--c-maint);border-color:var(--c-maint);}
.badge.cost{color:var(--c-cost);border-color:var(--c-cost);}
.badge.init{color:var(--c-init);border-color:var(--c-init);}
.badge.warn{color:var(--warn);border-color:var(--warn);}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:30px 0;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none;}
.chip{flex-shrink:0;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px);width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;z-index:90;display:none;}
.fab.show{display:block;}
@media(min-width:800px){.fab{right:calc(50% - 360px);}}
.chart-wrap{width:100%;overflow:hidden;}
.chart-wrap svg{display:block;width:100%;height:auto;}
.chart-tip{font-size:12px;color:var(--text2);min-height:1.4em;margin-top:4px;text-align:center;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2);margin-bottom:6px;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl td,table.tbl th{padding:7px 4px;border-bottom:1px solid var(--border);}
table.tbl th{font-size:11px;color:var(--text2);font-weight:600;text-align:left;}
table.tbl td.num,table.tbl th.num{text-align:right;white-space:nowrap;}
table.tbl tr.grp{cursor:pointer;}
table.tbl tr.grp td{font-weight:600;}
table.tbl tr.sub td{font-size:12px;color:var(--text2);}
table.tbl tr.sub td:first-child{padding-left:30px;}
.tw{display:inline-block;width:14px;color:var(--text3);}
.gdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
.ratio-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--bg3);}
.ratio-bar div{display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;font-weight:600;}
table.tbl tr.total td{font-weight:700;border-bottom:none;}
.remind{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px;}
.remind:last-child{border-bottom:none;}
.remind .rm-left{min-width:0;}
.remind .rm-sub{font-size:11px;color:var(--text2);}
.remind .rm-due{font-size:12px;font-weight:700;white-space:nowrap;}
.due-over{color:var(--danger);} .due-soon{color:var(--warn);} .due-ok{color:var(--success);}
.odo-big{font-size:30px;font-weight:700;letter-spacing:.02em;}
.odo-big small{font-size:14px;color:var(--text2);font-weight:400;margin-left:4px;}
/* sheet */
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;}
#sheet-bg.show{display:block;}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;background:var(--bg2);border-radius:16px 16px 0 0;z-index:201;display:none;flex-direction:column;max-width:760px;margin:0 auto;}
#sheet.show{display:flex;}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.sh-title{font-size:16px;font-weight:700;}
.sh-body{padding:14px 16px;overflow-y:auto;flex:1;}
.sh-foot{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);}
.sh-foot .btn{flex:1;padding:11px;}
.sh-foot .btn.danger{flex:0 0 auto;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;}
.fld .hint{font-size:11px;color:var(--text3);margin-top:4px;}
.fld-row{display:flex;gap:8px;}
.fld-row>.fld{flex:1;min-width:0;}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;}
.check input{width:18px;height:18px;}
.preview{background:var(--bg3);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text2);margin-bottom:12px;}
.preview b{color:var(--text);}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:8px;font-size:14px;}
.set-row:last-child{border-bottom:none;}
.cat-item{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.cat-item input{padding:6px 10px;font-size:14px;}
.cat-item .btn{flex-shrink:0;}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;}
#toast.show{opacity:1;}
.muted{color:var(--text2);font-size:12px;}
.car-ico{display:inline-block;vertical-align:-4px;flex-shrink:0;}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.swatch{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text2);background:var(--bg3);border:2px solid transparent;border-radius:10px;padding:6px 0 4px;cursor:pointer;min-width:0;white-space:nowrap;letter-spacing:-.02em;}
.swatch.active{border-color:var(--accent);color:var(--text);}
.dual-range{position:relative;height:30px;margin:4px 6px 0 44px;}
.dr-track,.dr-fill{position:absolute;top:13px;height:4px;border-radius:2px;}
.dr-track{left:0;right:0;background:var(--bg3);}
.dr-fill{background:var(--accent);}
.dual-range input[type=range]{position:absolute;left:0;top:0;width:100%;height:30px;margin:0;padding:0;background:none;border:none;-webkit-appearance:none;appearance:none;pointer-events:none;}
.dual-range input[type=range]::-webkit-slider-runnable-track{background:transparent;height:30px;}
.dual-range input[type=range]::-moz-range-track{background:transparent;}
.dual-range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:22px;height:22px;margin-top:4px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);}
.dual-range input[type=range]::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;}
</style>
</head>
<body>
<div id="header">
  <div class="h-title" id="h-title" onclick="openVehiclePicker()" style="cursor:pointer">CarLog</div>
  <span class="app-ver"></span>
  <button class="icon-btn" id="btn-settings" title="設定" onclick="showPage('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div id="app">
  <!-- ホーム -->
  <div class="page" id="page-home">
    <div class="page-header">
      <div class="page-title">サマリー</div>
      <div class="year-nav"><button class="yn-btn" data-year-step="-1" aria-label="前の年">‹</button><select class="year-sel" data-year-sel></select><button class="yn-btn" data-year-step="1" aria-label="次の年">›</button></div>
    </div>
    <div class="card">
      <div class="card-title">概要</div>
      <div class="kpi-grid" id="home-kpi"></div>
    </div>
    <div class="card" id="home-remind-card">
      <div class="card-title">次回予定・期限</div>
      <div id="home-remind"></div>
    </div>
    <div class="card">
      <div class="card-title" id="home-chart-title">月別費用</div>
      <div class="legend">
        <span><i style="background:var(--c-fuel)"></i>燃料</span>
        <span><i style="background:var(--c-maint)"></i>メンテナンス</span>
        <span><i style="background:var(--c-cost)"></i>その他費用</span>
        <span><i style="background:var(--c-init)"></i>初期費用</span>
      </div>
      <div class="chart-wrap" id="home-chart"></div>
      <div class="chart-tip" id="home-chart-tip"></div>
    </div>
    <div class="card">
      <div class="card-title">費用内訳</div>
      <div id="home-breakdown"></div>
    </div>
  </div>

  <!-- 給油 -->
  <div class="page" id="page-fuel">
    <div class="page-header">
      <div class="page-title">給油ログ</div>
      <div class="year-nav"><button class="yn-btn" data-year-step="-1" aria-label="前の年">‹</button><select class="year-sel" data-year-sel></select><button class="yn-btn" data-year-step="1" aria-label="次の年">›</button></div>
    </div>
    <div class="card">
      <div class="kpi-grid" id="fuel-kpi"></div>
    </div>
    <div class="card">
      <div class="card-title">燃費推移 <span class="muted">km/L（満タン法）</span></div>
      <div class="chart-wrap" id="fuel-chart"></div>
      <div class="chart-tip" id="fuel-chart-tip"></div>
    </div>
    <div class="list" id="fuel-list"></div>
  </div>

  <!-- ODO -->
  <div class="page" id="page-odo">
    <div class="page-header">
      <div class="page-title">ODOログ</div>
      <div class="year-nav"><button class="yn-btn" data-year-step="-1" aria-label="前の年">‹</button><select class="year-sel" data-year-sel></select><button class="yn-btn" data-year-step="1" aria-label="次の年">›</button></div>
    </div>
    <div class="card">

<script>
const APP_VERSION = 'v07_2026-11-14.3';
const STORAGE_KEY = 'carlog-data-v1';
const THEME_KEY = 'carlog-theme';

const DEFAULT_MAINT_CATS = ['車検','法定点検','オイル交換','オイルフィルター','タイヤ','バッテリー','洗車','コーティング','カスタム','修理','消耗品','その他'];
const DEFAULT_COST_CATS = ['任意保険','自動車税（種別割）','自賠責保険','自動車重量税','駐車場','高速・有料道路','ローン返済','ロードサービス・会員','その他'];
const DEFAULT_INIT_CATS = ['車両本体','値引き','下取り','環境性能割','自動車重量税','自賠責保険','自動車税（月割）','リサイクル料金','登録・納車費用','オプション・付属品','メンテナンスパック','延長保証','コーティング','その他'];
const CATS_VER = 3;
// 車両の色（アイコン用）
const CAR_COLORS = [['ブルー','#4f8ef7'],['ホワイト','#f2f3f5'],['シルバー','#a8adb7'],['グレー','#6b7280'],['ブラック','#2b2d33'],['レッド','#e05252'],['ネイビー','#2f4a8a'],['グリーン','#3ecf8e'],['イエロー','#f5c542'],['オレンジ','#f5a623'],['ブラウン','#8b5e3c'],['パープル','#a78bfa']];
const ICON_BG = '#1a1d27';
function colorLum(hex){ const n=parseInt(hex.slice(1),16); return 0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255); }
function isDarkColor(hex){ return colorLum(hex) < 80; }
// 車の図形（icons/icon.svg と同じ形）。win=窓・タイヤの色
function carShape(color, win){
  // 暗い色・白に近い色は輪郭線を付けて背景（ダーク／ライト）に埋もれないように
  const edge = (isDarkColor(color) || colorLum(color) > 225) ? ` stroke="#8b90a7" stroke-width="6"` : '';
  return `<g transform="translate(256 270)">
    <path d="M-170 30 L-170 -10 Q-170 -30 -150 -34 L-110 -42 L-70 -100 Q-60 -114 -42 -114 L70 -114 Q88 -114 100 -100 L140 -46 L160 -42 Q176 -38 176 -20 L176 30 Q176 44 162 44 L-156 44 Q-170 44 -170 30 Z" fill="${color}"${edge}/>
    <path d="M-92 -46 L-60 -94 Q-56 -98 -50 -98 L-6 -98 L-6 -46 Z" fill="${win}"/>
    <path d="M10 -46 L10 -98 L66 -98 Q72 -98 76 -94 L112 -46 Z" fill="${win}"/>
    <circle cx="-100" cy="44" r="42" fill="${win}"/><circle cx="-100" cy="44" r="26" fill="#e8eaf0"/>
    <circle cx="108" cy="44" r="42" fill="${win}"/><circle cx="108" cy="44" r="26" fill="#e8eaf0"/></g>`;
}
// 画面内の小アイコン（背景なし）
function carIco(color, size=22){
  return `<svg class="car-ico" viewBox="76 148 362 216" width="${Math.round(size*362/216)}" height="${size}">${carShape(color||CAR_COLORS[0][1], 'var(--bg2)')}</svg>`;
}
// アプリアイコン（rounded=タブ用の角丸、false=ホーム画面用の全面塗り・縮小）
function appIconSvg(color, rounded){
  const body = rounded ? carShape(color, ICON_BG) + '<rect x="96" y="390" width="320" height="18" rx="9" fill="#f5a623"/>'
    : `<g transform="translate(256 256) scale(0.82) translate(-256 -256)">${carShape(color, ICON_BG)}<rect x="96" y="390" width="320" height="18" rx="9" fill="#f5a623"/></g>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512"${rounded?' rx="96"':''} fill="${ICON_BG}"/>${body}</svg>`;
}
// タブのアイコン・iPhone のホーム画面アイコン（追加時点の色）を表示中の車両の色に
let _iconColor = null;
function updateAppIcons(){
  const color = V.info.color || CAR_COLORS[0][1];
  if(color === _iconColor) return;
  _iconColor = color;
  const url = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  $('fav-svg').href = url(appIconSvg(color, true));
  const toPng = (svg, n, cb) => {
    const img = new Image();
    img.onload = () => { const c=document.createElement('canvas'); c.width=c.height=n; c.getContext('2d').drawImage(img,0,0,n,n); try{ cb(c.toDataURL('image/png')); }catch{} };
    img.src = url(svg);
  };
  toPng(appIconSvg(color, true), 32, d=>{ $('fav-png').href = d; });
  toPng(appIconSvg(color, false), 180, d=>{ $('apple-icon').href = d; });
}
const FUEL_TYPES = ['レギュラー','ハイオク','軽油','電気','その他'];

// データ: { vehicles:[{id, info, fuel, odo, maint, costs, initCosts, sample}], curId, 区分（全車両共通） }
function newVehicle(info){
  return {id:uid(), sample:false,
    info:Object.assign({name:'',model:'',year:'',purchaseDate:'',initialOdo:'',fuelType:'レギュラー',tankCapacity:'',color:CAR_COLORS[0][1]}, info||{}),
    fuel:[], odo:[], maint:[], costs:[], initCosts:[]};
}
function emptyData(){
  const car = newVehicle({name:'マイカー'});
  return {catsVer:CATS_VER, vehicles:[car, buildSample()], curId:car.id,
    maintCats:[...DEFAULT_MAINT_CATS], costCats:[...DEFAULT_COST_CATS], initCats:[...DEFAULT_INIT_CATS]};
}
function loadData(){
  try{
    const s = localStorage.getItem(STORAGE_KEY);
    if(!s) return emptyData();
    return migrate(JSON.parse(s));
  }catch(e){ console.error(e); return emptyData(); }
}
function migrate(raw){
  if(!raw.catsVer) raw.catsVer = 1;
  const d = {catsVer:raw.catsVer, maintCats:raw.maintCats||[...DEFAULT_MAINT_CATS], costCats:raw.costCats||[...DEFAULT_COST_CATS], initCats:raw.initCats||[...DEFAULT_INIT_CATS]};
  if(Array.isArray(raw.vehicles)){
    d.vehicles = raw.vehicles.map(v=>Object.assign(newVehicle(), v, {info:Object.assign(newVehicle().info, v.info||{})}));
    d.curId = raw.curId;
  }else{
    // 旧形式（1台・フラット）→ 1台目に移行し、サンプル車を追加
    const v = newVehicle(raw.vehicle);
    ['fuel','odo','maint','costs','initCosts'].forEach(k=>{ if(Array.isArray(raw[k])) v[k] = raw[k]; });
    if(!v.info.name) v.info.name = 'マイカー';
    d.vehicles = [v, buildSample()]; d.curId = v.id;
  }
  d.vehicles.forEach(v=>{
    // 旧形式: 費用の initial フラグ → 初期費用リストへ移行
    v.costs.filter(c=>c.initial).forEach(c=>{
      v.initCosts.push({id:c.id, category:c.category, title:c.title||'', amount:c.amount, memo:c.memo||''});
      if(!d.initCats.includes(c.category)) d.initCats.push(c.category);
    });
    v.costs = v.costs.filter(c=>!c.initial);
  });
  if(d.catsVer < 2){
    // 区分名の統一・並び順を新しい初期値に（独自追加の区分は末尾に残す）
    const ren = {'自動車税':'自動車税（種別割）','重量税':'自動車重量税','ローン':'ローン返済','JAF・会員':'ロードサービス・会員'};
    d.vehicles.forEach(v=>v.costs.forEach(c=>{ if(ren[c.category]) c.category = ren[c.category]; }));
    const cc = d.costCats.map(c=>ren[c]||c);
    d.costCats = [...DEFAULT_COST_CATS, ...cc.filter(c=>!DEFAULT_COST_CATS.includes(c))];
    d.initCats = [...DEFAULT_INIT_CATS, ...d.initCats.filter(c=>!DEFAULT_INIT_CATS.includes(c))];
    d.catsVer = 2;
  }
  if(d.catsVer < 3){
    // 「手洗い洗車」を「洗車」に統合（内容が空なら「手洗い」と残す）
    d.vehicles.forEach(v=>v.maint.forEach(m=>{ if(m.category==='手洗い洗車'){ m.category='洗車'; if(!m.title) m.title='手洗い'; } }));
    d.maintCats = d.maintCats.filter(c=>c!=='手洗い洗車');
    if(!d.maintCats.includes('洗車')) d.maintCats.unshift('洗車');
    d.catsVer = 3;
  }
  if(!d.vehicles.length) d.vehicles.push(newVehicle({name:'マイカー'}));
  if(!d.vehicles.some(v=>v.id===d.curId)) d.curId = d.vehicles[0].id;
  return d;
}
let D, V;   // D=全データ, V=表示中の車両（起動時に初期化）
function syncV(){ V = D.vehicles.find(v=>v.id===D.curId) || D.vehicles[0]; D.curId = V.id; }
const DIRTY_KEY = 'carlog-dirty';   // 未ログイン中に編集した印（ログイン時の確認に使用）
function saveLocal(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(D)); }catch(e){ toast('保存に失敗しました'); }
}
function saveData(){
  saveLocal();
  if(window._cloud && window._cloud.user) window._cloud.push();
  else { try{ localStorage.setItem(DIRTY_KEY,'1'); }catch{} }
}
// クラウド保存対象: サンプル車と表示中の車両（curId）は端末ごとに持つため除外
function cloudJson(){
  return JSON.stringify({catsVer:D.catsVer, vehicles:D.vehicles.filter(v=>!v.sample), maintCats:D.maintCats, costCats:D.costCats, initCats:D.initCats});
}
function applyCloudJson(json){
  const samples = D.vehicles.filter(v=>v.sample), cur = D.curId;
  const d = migrate(JSON.parse(json));
  d.vehicles = d.vehicles.filter(v=>!v.sample).concat(samples.length ? samples : [buildSample()]);
  d.curId = d.vehicles.some(v=>v.id===cur) ? cur : d.vehicles[0].id;
  D = d; syncV(); saveLocal(); render();
}
function askSyncChoice(){
  return new Promise(resolve=>{
    let done = false;
    const xBtn = document.querySelector('#sheet .sh-head .icon-btn');
    const pick = v => { if(done) return; done = true; $('sheet-bg').onclick = closeSheet; xBtn.style.display = ''; closeSheet(); resolve(v); };
    window._syncPick = pick;
    openSheet('同期するデータを選択', `
      <div class="muted" style="margin-bottom:12px;">ログインしていない間にこの端末で編集したデータがあり、クラウドのデータと異なります。</div>
      <button class="btn primary" style="width:100%;margin-bottom:8px;" onclick="_syncPick('cloud')">クラウドのデータを使う<div style="font-size:11px;font-weight:400;">この端末のデータは置き換わります</div></button>
      <button class="btn" style="width:100%;margin-bottom:8px;" onclick="_syncPick('local')">この端末のデータでクラウドを上書き<div class="muted" style="font-size:11px;">他の端末のデータも置き換わります</div></button>
      <button class="btn" style="width:100%;" onclick="_syncPick('cancel')">ログインをやめる</button>`);
    $('sheet-bg').onclick = () => pick('cancel');
    xBtn.style.display = 'none';
    $('sh-foot').innerHTML = '';
  });
}
// 設定「クラウド同期」
function parseFirebaseConfig(text){
  try{ return JSON.parse(text.trim()); }catch{}
  try{
    const m = text.replace(/\/\/.*$/gm,'').match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0].replace(/([{,]\s*)(\w+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*\}/,'}')) : null;
  }catch{ return null; }
}
function saveFirebaseConfig(){
  const cfg = parseFirebaseConfig($('fb-config').value||'');
  if(!cfg || !cfg.apiKey){ toast('Firebase config を読み取れませんでした'); return; }
  try{ localStorage.setItem('firebase-config-v1', JSON.stringify(cfg)); }catch{}
  location.reload();
}
function clearFirebaseConfig(){
  if(!confirm('Firebase の設定を削除しますか？\n（同じサイトの他のツールの設定も消えます）')) return;
  try{ localStorage.removeItem('firebase-config-v1'); }catch{}
  location.reload();
}
function renderCloud(){
  const el = $('set-cloud'); if(!el) return;
  const C = window._cloud;
  if(!C){ el.innerHTML = '<div class="muted">Firebase を読み込めません（オフライン、または読み込み中）</div>'; return; }
  const cfgText = (()=>{ try{ return localStorage.getItem('firebase-config-v1')||''; }catch{ return ''; } })();
  const cfgArea = `<details style="margin-top:10px;"><summary class="muted" style="cursor:pointer;">Firebase 設定${C.configured?'（'+esc(C.projectId)+'）':''}</summary>
    <textarea id="fb-config" style="margin-top:8px;height:120px;font-family:monospace;font-size:12px;" placeholder="Firebase の config をここに貼り付け">${esc(cfgText?JSON.stringify(JSON.parse(cfgText),null,2):'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;"><button class="btn sm primary" onclick="saveFirebaseConfig()">保存して再読み込み</button>${C.configured?'<button class="btn sm danger" onclick="clearFirebaseConfig()">削除</button>':''}</div>
    <div class="muted" style="margin-top:6px;">同じサイトの他のツール（タイムカード等）と共通の設定です</div></details>`;
  if(!C.configured){
    el.innerHTML = `<div class="muted">Firebase の設定をすると、Googleログインでスマホ・PC間の同期ができます（未設定でも端末内に保存して使えます）</div>` + cfgArea.replace('<details ','<details open ');
    return;
  }
  const st = C.status ? `<div class="muted" style="margin-top:4px;color:${/エラー/.test(C.status)?'var(--danger)':'var(--text2)'}">${esc(C.status)}</div>` : '';
  el.innerHTML = C.user
    ? `<div class="set-row"><div>${esc(C.user.name||C.user.email)}<div class="muted">${esc(C.user.email)}</div>${st}</div><button class="btn sm" onclick="_cloud.logout()">ログアウト</button></div>
       <div class="muted">サンプル車は同期しません（各端末で自動生成）</div>${cfgArea}`
    : `<div class="set-row"><div>Googleログイン<div class="muted">ログインするとスマホ・PC間で同期します</div>${st}</div><button class="btn sm primary" onclick="_cloud.login()">ログイン</button></div>${cfgArea}`;
}

const state = { page:'home', year:String(new Date().getFullYear()), odoFilter:'all', odoRange:'year', maintFilter:'all', costFilter:'all' };

/* ---------- util ---------- */
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : null; };
const fmt = (v, d=0) => v==null || !isFinite(v) ? '—' : Number(v).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
const yen = v => v==null ? '—' : (v<0?'-':'') + '¥' + fmt(Math.abs(Math.round(v)));
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const dateMs = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).getTime(); };
const ymOf = s => s.slice(0,7);
const inYear = s => state.year==='all' || (s && s.slice(0,4)===state.year);
const byDateDesc = (a,b) => (b.date||'').localeCompare(a.date||'') || (num(b.odo)||0)-(num(a.odo)||0);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function daysBetween(a,b){ return Math.round((dateMs(b)-dateMs(a))/86400000); }

/* ---------- 計算 ---------- */
// 満タン法: 満タン→満タン間の走行距離 / その間の給油量合計
function calcFuelStats(){
  const list = V.fuel.filter(f=>num(f.odo)!=null).slice().sort((a,b)=>num(a.odo)-num(b.odo) || a.date.localeCompare(b.date));
  const res = {};
  let lastFull = null, acc = 0, prev = null;
  for(const f of list){
    const r = { dist: prev ? num(f.odo)-num(prev.odo) : null, eco:null, segKm:null, segL:null };
    acc += num(f.liters)||0;
    if(f.full){
      if(lastFull){
        const km = num(f.odo)-num(lastFull.odo);
        if(km>0 && acc>0){ r.eco = km/acc; r.segKm = km; r.segL = acc; }
      }
      lastFull = f; acc = 0;
    }
    res[f.id] = r; prev = f;
  }
  return res;
}

function odoPoints(){
  const pts = [];
  const v = V.info;
  if(v.purchaseDate && num(v.initialOdo)!=null) pts.push({date:v.purchaseDate, odo:num(v.initialOdo), src:'init', id:'init'});
  V.odo.forEach(o=>{ if(num(o.odo)!=null) pts.push({date:o.date, odo:num(o.odo), src:'odo', id:o.id, memo:o.memo}); });
  V.fuel.forEach(f=>{ if(num(f.odo)!=null) pts.push({date:f.date, odo:num(f.odo), src:'fuel', id:f.id}); });
  V.maint.forEach(m=>{ if(num(m.odo)!=null) pts.push({date:m.date, odo:num(m.odo), src:'maint', id:m.id, memo:m.title}); });
  pts.sort((a,b)=>a.date.localeCompare(b.date) || a.odo-b.odo);
  return pts;
}
// 日付境界のODOを線形補間（範囲外は端点）
function odoAt(pts, t){
  if(!pts.length) return null;
  const ts = pts.map(p=>dateMs(p.date));
  if(t<=ts[0]) return pts[0].odo;
  if(t>=ts[ts.length-1]) return pts[pts.length-1].odo;
  for(let i=1;i<pts.length;i++){
    if(t<=ts[i]){
      const t0=ts[i-1], t1=ts[i];
      if(t1===t0) return pts[i].odo;
      return pts[i-1].odo + (pts[i].odo-pts[i-1].odo)*(t-t0)/(t1-t0);
    }
  }
  return pts[pts.length-1].odo;
}
function distBetween(pts, t0, t1){
  if(pts.length<2) return 0;
  return Math.max(0, odoAt(pts,t1)-odoAt(pts,t0));
}
function currentOdo(){
  const pts = odoPoints();
  if(!pts.length) return null;
  return pts.reduce((m,p)=>p.odo>m.odo?p:m, pts[0]);
}

function costEntries(){
  const e = [];
  V.fuel.forEach(f=>{ const a=num(f.total); if(a) e.push({date:f.date, group:'fuel', cat:'燃料', amount:a, initial:false}); });
  V.maint.forEach(m=>{ const a=num(m.cost); if(a) e.push({date:m.date, group:'maint', cat:m.category||'その他', amount:a, initial:false}); });
  V.costs.forEach(c=>{ const a=num(c.amount); if(a) e.push({date:c.date, group:'cost', cat:c.category||'その他', amount:a, initial:false}); });
  V.initCosts.forEach(c=>{ const a=num(c.amount); if(a) e.push({date:V.info.purchaseDate||'', group:'init', cat:c.category||'その他', amount:a, initial:true}); });
  return e;
}

function periodRange(){
  if(state.year==='all'){
    const all = [...V.fuel,...V.odo,...V.maint,...V.costs].map(x=>x.date).filter(Boolean);
    if(V.info.purchaseDate) all.push(V.info.purchaseDate);
    if(!all.length) return null;
    all.sort();
    return {t0:dateMs(all[0]), t1:Math.max(dateMs(all[all.length-1]), dateMs(todayStr()))};
  }
  const y = +state.year;
  return {t0:new Date(y,0,1).getTime(), t1:new Date(y+1,0,1).getTime()};
}

/* ---------- 年セレクト ---------- */
function yearsInData(){
  const s = new Set([String(new Date().getFullYear())]);
  [...V.fuel,...V.odo,...V.maint,...V.costs].forEach(x=>{ if(x.date) s.add(x.date.slice(0,4)); });
  return [...s].sort().reverse();
}
function setYear(y){ state.year = y; state.odoRange = y==='all' ? 'all' : 'year'; render(); }
function renderYearSelects(){
  const ys = yearsInData();
  if(state.year!=='all' && !ys.includes(state.year)) state.year = ys[0];
  const html = ys.map(y=>`<option value="${y}">${y}年</option>`).join('') + '<option value="all">全期間</option>';
  document.querySelectorAll('[data-year-sel]').forEach(sel=>{
    sel.innerHTML = html; sel.value = state.year;
    sel.onchange = () => setYear(sel.value);
  });
  // ‹ / › で 古い年 … 最新年 → 全期間 の順に移動
  const seq = ys.slice().reverse().concat('all'), i = seq.indexOf(state.year);
  document.querySelectorAll('[data-year-step]').forEach(btn=>{
    const j = i + (+btn.dataset.yearStep);
    btn.disabled = i<0 || j<0 || j>=seq.length;
    btn.onclick = () => { if(!btn.disabled) setYear(seq[j]); };
  });
}

/* ---------- チャート（SVG） ---------- */
// Y軸: 刻み 1・2・2.5・5×10^n、目盛り数5以下で最小の上限
function niceScale(v){
  if(!(v>0)) return {max:1, step:0.25, n:4};
  const raw = v/5, p = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = 10*p;
  for(const m of [1,2,2.5,5,10]) if(m*p>=raw){ step = m*p; break; }
  const n = Math.max(1, Math.ceil(v/step - 1e-9));
  return {max:step*n, step, n};
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function barChart(el, tipEl, labels, series, unitFmt){
  const W=Math.max(300, el.clientWidth||640), H=200, mL=44, mR=8, mT=14, mB=24;
  const totals = labels.map((_,i)=>series.reduce((s,se)=>s+(se.values[i]||0),0));
  const {max, n:nT} = niceScale(Math.max(...totals,0));
  const pw = W-mL-mR, ph = H-mT-mB, bw = pw/labels.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  const grid = cssVar('--border'), txt = cssVar('--text2');
  for(let i=0;i<=nT;i++){
    const y = mT + ph - ph*i/nT;
    svg += `<line x1="${mL}" x2="${W-mR}" y1="${y}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;
    svg += `<text x="${mL-6}" y="${y+4}" font-size="11" fill="${txt}" text-anchor="end">${unitFmt(max*i/nT, true)}</text>`;
  }
  labels.forEach((lb,i)=>{
    let y = mT+ph;
    const x = mL + bw*i + bw*0.18, w = bw*0.64;
    series.forEach(se=>{
      const v = se.values[i]||0; if(!v) return;
      const h = ph*v/max; y -= h;
      svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${cssVar(se.color)}" rx="2"/>`;
    });
    svg += `<rect x="${mL+bw*i}" y="${mT}" width="${bw}" height="${ph}" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if(labels.length<=16 || i%Math.ceil(labels.length/12)===0)
      svg += `<text x="${mL+bw*i+bw/2}" y="${H-7}" font-size="11" fill="${txt}" text-anchor="middle">${esc(lb)}</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  const show = i => {
    const parts = series.filter(se=>se.values[i]).map(se=>`${se.name} ${unitFmt(se.values[i])}`);
    tipEl.textContent = `${labels[i]}：${unitFmt(totals[i])}` + (series.length>1 && parts.length ? `（${parts.join(' / ')}）` : '');
  };
  el.querySelectorAll('rect[data-i]').forEach(r=>{
    r.addEventListener('mouseenter',()=>show(+r.dataset.i));
    r.addEventListener('click',()=>show(+r.dataset.i));
  });
  tipEl.textContent = 'バーをタップで詳細';
}

function lineChart(el, tipEl, pts){
  if(pts.length<1){ el.innerHTML = '<div class="empty">満タン給油が2回以上で表示されます</div>'; tipEl.textContent=''; return; }
  const W=Math.max(300, el.clientWidth||640), H=180, mL=36, mR=12, mT=14, mB=24;
  const vals = pts.map(p=>p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi-lo)*0.15, 1);
  lo = Math.max(0, Math.floor(lo-pad)); hi = Math.ceil(hi+pad);
  const pw=W-mL-mR, ph=H-mT-mB;
  const X = i => mL + (pts.length===1 ? pw/2 : pw*i/(pts.length-1));
  const Y = v => mT + ph - ph*(v-lo)/(hi-lo);
  const grid = cssVar('--border'), txt = cssVar('--text2'), ac = cssVar('--c-fuel');
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){
    const v = lo+(hi-lo)*i/4, y=Y(v);
    svg += `<line x1="${mL}" x2="${W-mR}" y1="${y}" y2="${y}" stroke="${grid}"/>`;
    svg += `<text x="${mL-6}" y="${y+4}" font-size="11" fill="${txt}" text-anchor="end">${fmt(v,1)}</text>`;
  }
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  svg += `<line x1="${mL}" x2="${W-mR}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="${txt}" stroke-dasharray="4 4"/>`;
  svg += `<polyline fill="none" stroke="${ac}" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>`;
  const step = Math.ceil(pts.length/8);
  pts.forEach((p,i)=>{
    svg += `<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="${ac}"/>`;
    svg += `<circle cx="${X(i)}" cy="${Y(p.v)}" r="14" fill="transparent" data-i="${i}" style="cursor:pointer"/>`;
    if(i%step===0 || i===pts.length-1) svg += `<text x="${X(i)}" y="${H-7}" font-size="11" fill="${txt}" text-anchor="middle">${p.label}</text>`;
  });
  svg += '</svg>';
  el.innerHTML = svg;
  const show = i => { const p=pts[i]; tipEl.textContent = `${p.date}：${fmt(p.v,2)} km/L（${fmt(p.km,0)} km / ${fmt(p.l,2)} L）`; };
  el.querySelectorAll('circle[data-i]').forEach(c=>{
    c.addEventListener('mouseenter',()=>show(+c.dataset.i));
    c.addEventListener('click',()=>show(+c.dataset.i));
  });
  tipEl.textContent = `平均 ${fmt(avg,2)} km/L（破線）`;
}

// 累積走行距離（期間開始=0）
function cumChart(el, tipEl, pts, t0, t1){
  const DAY=86400000, days=Math.round((t1-t0)/DAY), step=Math.max(1,Math.ceil(days/150));
  const data=[];
  for(let d=0; d<=days; d+=step) data.push(t0+d*DAY);
  if(data[data.length-1]!==t1) data.push(t1);
  const base=odoAt(pts,t0);
  const vals=data.map(t=>({t, v:odoAt(pts,t)-base, odo:odoAt(pts,t)}));
  const W=Math.max(300, el.clientWidth||640), H=180, mL=44, mR=12, mT=14, mB=24;
  const {max, n:nT}=niceScale(vals[vals.length-1].v), pw=W-mL-mR, ph=H-mT-mB;
  const X=t=>mL+pw*(t-t0)/(t1-t0), Y=v=>mT+ph-ph*v/max;
  const grid=cssVar('--border'), txt=cssVar('--text2'), ac=cssVar('--accent');
  const lbl=t=>{ const d=new Date(t); return (days>400?String(d.getFullYear()).slice(2)+'/':'')+(d.getMonth()+1)+(days>400?'':'/'+d.getDate()); };
  let svg=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=nT;i++){ const y=Y(max*i/nT); svg+=`<line x1="${mL}" x2="${W-mR}" y1="${y}" y2="${y}" stroke="${grid}"/><text x="${mL-6}" y="${y+4}" font-size="11" fill="${txt}" text-anchor="end">${fmt(max*i/nT)}</text>`; }
  const line=vals.map(p=>X(p.t)+','+Y(p.v)).join(' ');
  svg+=`<polygon points="${X(t0)},${Y(0)} ${line} ${X(t1)},${Y(0)}" fill="${ac}" opacity=".15"/><polyline points="${line}" fill="none" stroke="${ac}" stroke-width="2.5"/>`;
  pts.filter(p=>{const t=dateMs(p.date); return t>=t0&&t<=t1;}).forEach(p=>{ svg+=`<circle cx="${X(dateMs(p.date))}" cy="${Y(p.odo-base)}" r="2.5" fill="${ac}"/>`; });
  for(let i=0;i<=4;i++){ const t=t0+(t1-t0)*i/4; svg+=`<text x="${X(t)}" y="${H-7}" font-size="11" fill="${txt}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${lbl(t)}</text>`; }
  svg+=`<rect x="${mL}" y="${mT}" width="${pw}" height="${ph}" fill="transparent" id="cum-hit" style="cursor:crosshair"/><line id="cum-cursor" y1="${mT}" y2="${mT+ph}" stroke="${txt}" stroke-dasharray="3 3" style="display:none"/></svg>`;
  el.innerHTML=svg;
  const hit=el.querySelector('#cum-hit'), cur=el.querySelector('#cum-cursor'), svgEl=el.querySelector('svg');
  const show=e=>{
    const r=svgEl.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width;
    const t=t0+(t1-t0)*Math.min(1,Math.max(0,(x-mL)/pw));
    const p=vals.reduce((a,b)=>Math.abs(b.t-t)<Math.abs(a.t-t)?b:a);
    cur.setAttribute('x1',X(p.t)); cur.setAttribute('x2',X(p.t)); cur.style.display='';
    const d=new Date(p.t);
    tipEl.textContent=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}：累積 ${fmt(p.v)} km（ODO ${fmt(p.odo)} km）`;
  };
  hit.addEventListener('mousemove',show); hit.addEventListener('click',show);
  tipEl.textContent=`期間合計 ${fmt(vals[vals.length-1].v)} km（グラフをタップで詳細）`;
}

// 累積走行距離: 年フィルタ（year）を起点に、プリセット・保険年度（ins）・スライダー（custom）で期間変更
const CUM_RANGES=[['1m','1カ月',1],['3m','3カ月',3],['6m','6カ月',6],['1y','直近1年',12],['ins','保険年度',-1],['all','全期間',0]];
const DAY_MS = 86400000;
// 最新の任意保険の記録（開始日〜期限、期限なしは1年）
function insuranceTerm(){
  const today = todayStr();
  const list = V.costs.filter(c=>/任意保険/.test(c.category||'') && c.date).sort(byDateDesc);
  const c = list.find(x=>x.date<=today) || list[list.length-1];
  if(!c) return null;
  const t0 = dateMs(c.date);
  let t1;
  if(c.until && c.until>c.date) t1 = dateMs(c.until);
  else { const d=new Date(t0); d.setFullYear(d.getFullYear()+1); t1 = d.getTime()-DAY_MS; }
  return {t0, t1, rec:c};
}
// 保険年度の走行距離と満期までの予測（現在のペースで延長）
function insKpi(pts){
  const ins = insuranceTerm();
  if(!ins || pts.length<2) return kpi('記録数', pts.filter(p=>inYear(p.date)).length, '件');
  const now = dateMs(todayStr()), end = Math.min(now, ins.t1);
  const done = end>=ins.t0 ? distBetween(pts, ins.t0, end) : 0;
  const f = t=>{ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
  let sub;
  if(now>=ins.t1) sub = `${f(ins.t0)}〜${f(ins.t1)}（満了）`;
  else{
    const el = Math.max(1, (now-ins.t0)/DAY_MS), tot = (ins.t1-ins.t0)/DAY_MS + 1;
    sub = `満期${f(ins.t1)}予測 ${fmt(done/el*tot)} km`;
  }
  return kpi('保険年度走行', fmt(done), 'km', sub);
}
function renderCum(pts){
  const ins = insuranceTerm();
  if(state.odoRange==='ins' && !ins) state.odoRange = 'all';
  $('odo-cum-filter').innerHTML = CUM_RANGES.filter(r=>r[0]!=='ins'||ins).map(([k,n])=>`<button class="chip ${state.odoRange===k?'active':''}" onclick="state.odoRange='${k}';render()">${n}</button>`).join('');
  if(pts.length<2){
    $('odo-cum-chart').innerHTML='<div class="empty">ODOの記録が2件以上で表示されます</div>'; $('odo-cum-tip').textContent=''; $('odo-cum-range').textContent='';
    $('cum-slider').style.display='none'; return;
  }
  $('cum-slider').style.display='';
  const minT = dateMs(pts[0].date), maxT = Math.max(dateMs(todayStr()), dateMs(pts[pts.length-1].date));
  const maxD = Math.round((maxT-minT)/DAY_MS);
  let t0, t1;
  if(state.odoRange==='custom' && state.cumRange){
    t0 = Math.max(minT, state.cumRange[0]); t1 = Math.min(maxT, state.cumRange[1]);
    if(t1-t0 < DAY_MS){ t0 = minT; t1 = maxT; }
  }else if(state.odoRange==='year' && state.year!=='all'){
    const y = +state.year;
    t0 = Math.max(minT, new Date(y,0,1).getTime()); t1 = Math.min(maxT, new Date(y,11,31).getTime());
    if(t1-t0 < DAY_MS){ t0 = minT; t1 = maxT; }
  }else if(state.odoRange==='ins' && ins){
    t0 = Math.max(minT, ins.t0); t1 = Math.min(maxT, ins.t1);
    if(t1-t0 < DAY_MS){ t0 = minT; t1 = maxT; }
  }else{
    t1 = maxT;
    const mo = (CUM_RANGES.find(r=>r[0]===state.odoRange)||CUM_RANGES[CUM_RANGES.length-1])[2];
    if(mo>0){ const d=new Date(t1); d.setMonth(d.getMonth()-mo); t0=Math.max(minT, d.getTime()); } else t0 = minT;
  }
  const S=$('cum-s'), E=$('cum-e');
  [S,E].forEach(el=>{ el.min=0; el.max=maxD; });
  S.value = Math.round((t0-minT)/DAY_MS); E.value = Math.round((t1-minT)/DAY_MS);
  const draw = () => {
    const a = minT + (+S.value)*DAY_MS, b = minT + (+E.value)*DAY_MS;
    const f = t=>{ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
    $('odo-cum-range').textContent = `${f(a)}〜${f(b)}`;
    $('cum-fill').style.left = `calc(11px + (100% - 22px) * ${S.value/maxD})`; $('cum-fill').style.width = `calc((100% - 22px) * ${(E.value-S.value)/maxD})`;
    cumChart($('odo-cum-chart'), $('odo-cum-tip'), pts, a, b);
  };
  const onSlide = which => {
    const gap = Math.min(7, maxD);
    if(+E.value - +S.value < gap){ if(which==='s') S.value = +E.value - gap; else E.value = +S.value + gap; }
    state.odoRange = 'custom'; state.cumRange = [minT + (+S.value)*DAY_MS, minT + (+E.value)*DAY_MS];
    document.querySelectorAll('#odo-cum-filter .chip').forEach(c=>c.classList.remove('active'));
    draw();
  };
  S.oninput = () => onSlide('s'); E.oninput = () => onSlide('e');
  // 両つまみが右端で重なった場合に開始側を操作できるよう前面に
  S.style.zIndex = +S.value > maxD-2 ? 3 : 1; E.style.zIndex = 2;
  draw();
}

/* ---------- 共通：リスト描画 ---------- */
function groupedList(items, rowFn, sumFn){
  if(!items.length) return '<div class="empty">記録がありません<br>右下の ＋ から追加できます</div>';
  let html='', cur='';
  const groups = {};
  items.forEach(it=>{ (groups[ymOf(it.date)] ||= []).push(it); });
  Object.keys(groups).sort().reverse().forEach(ym=>{
    const [y,m] = ym.split('-');
    html += `<div class="list-month"><span>${y}年${+m}月</span><span>${sumFn?sumFn(groups[ym]):''}</span></div>`;
    groups[ym].forEach(it=>{ html += rowFn(it); });
  });
  return html;
}
function dateCell(s){ const [y,m,d]=s.split('-'); const w='日月火水木金土'[new Date(+y,+m-1,+d).getDay()]; return `<div class="r-date"><b>${+d}</b>${w}</div>`; }
function kpi(label, val, unit, sub){ return `<div class="kpi"><div class="k-label">${label}</div><div class="k-val">${val}<span class="k-unit">${unit||''}</span></div><div class="k-sub">${sub||''}</div></div>`; }   // 補足が無くても行を確保してカードの高さをそろえる
function chipsHtml(cats, cur, key){
  return ['all',...cats].map(c=>`<button class="chip ${cur===c?'active':''}" onclick="state.${key}='${esc(c)}';render()">${c==='all'?'すべて':esc(c)}</button>`).join('');
}

/* ---------- ホーム ---------- */
function renderHome(){
  const entries = costEntries().filter(e=>inYear(e.date));
  const sum = g => entries.filter(e=>!g||e.group===g).reduce((s,e)=>s+e.amount,0);
  const total = sum(), running = entries.filter(e=>!e.initial).reduce((s,e)=>s+e.amount,0);
  const pts = odoPoints(), rng = periodRange();
  const dist = rng ? distBetween(pts, rng.t0, rng.t1) : 0;
  const fs = calcFuelStats();
  let km=0, l=0;
  V.fuel.filter(f=>inYear(f.date)).forEach(f=>{ const r=fs[f.id]; if(r&&r.eco){ km+=r.segKm; l+=r.segL; } });
  const cur = currentOdo();
  $('home-kpi').innerHTML =
    kpi('費用合計', yen(total), '', running!==total ? `維持費 ${yen(running)}` : '') +
    kpi('走行距離', fmt(dist), 'km', cur ? `ODO ${fmt(cur.odo)} km` : '') +
    kpi('平均燃費', l ? fmt(km/l,2) : '—', 'km/L') +
    kpi('維持費/km', dist ? fmt(running/dist,1) : '—', '円', dist ? `燃料費/km ${fmt(sum('fuel')/dist,1)}円` : '');

  renderReminders();

  // 月別費用
  let labels=[], keys=[];
  if(state.year==='all'){
    const ys = [...new Set(costEntries().map(e=>e.date.slice(0,4)).filter(Boolean))].sort();
    keys = ys; labels = ys.map(y=>y.slice(2)+'年');
    $('home-chart-title').textContent = '年別費用';
  }else{
    keys = Array.from({length:12},(_,i)=>state.year+'-'+String(i+1).padStart(2,'0'));
    labels = keys.map((_,i)=>(i+1)+'月');
    $('home-chart-title').textContent = '月別費用';
  }
  const kOf = e => state.year==='all' ? e.date.slice(0,4) : ymOf(e.date);
  const series = [['fuel','燃料','--c-fuel'],['maint','メンテ','--c-maint'],['cost','その他','--c-cost'],['init','初期','--c-init']].map(([g,n,c])=>({
    name:n, color:c, values: keys.map(k=>entries.filter(e=>e.group===g && kOf(e)===k).reduce((s,e)=>s+e.amount,0))
  }));
  if(keys.length) barChart($('home-chart'), $('home-chart-tip'), labels, series, (v,axis)=>axis ? (v>=10000 ? fmt(v/10000, v%10000?1:0)+'万' : fmt(v)) : yen(v));
  else { $('home-chart').innerHTML='<div class="empty">データがありません</div>'; $('home-chart-tip').textContent=''; }

  // 内訳
  const cats = {};
  entries.forEach(e=>{ const k=e.group+'|'+e.cat; (cats[k] ||= {group:e.group, cat:e.cat, amount:0, n:0}); cats[k].amount+=e.amount; cats[k].n++; });
  // 中項目（燃料・メンテ・その他費用・初期費用）＋折りたたみ明細。比率は維持費（初期費用を除く）基準
  const GROUPS = [['fuel','燃料','燃料'],['maint','メンテナンス','メンテ'],['cost','その他費用','費用'],['init','初期費用','初期']];
  const pct = a => running ? fmt(a/running*100,1)+'%' : '—';
  if(!entries.length){ $('home-breakdown').innerHTML = '<div class="empty">データがありません</div>'; return; }
  const gs = GROUPS.map(([g,name,short])=>{
    const items = Object.values(cats).filter(r=>r.group===g).sort((a,b)=>b.amount-a.amount);
    return {g, name, short, items, amount:items.reduce((s,r)=>s+r.amount,0), n:items.reduce((s,r)=>s+r.n,0)};
  }).filter(x=>x.items.length);
  // 維持費の100%積み上げ横棒
  const bar = running ? `<div class="ratio-bar">${gs.filter(x=>x.g!=='init' && x.amount>0).map(x=>{
      const w = x.amount/running*100;
      return `<div style="width:${w}%;background:var(--c-${x.g})" title="${x.name} ${fmt(w,1)}%">${w>=14?`${x.short} ${fmt(w,0)}%`:w>=7?`${fmt(w,0)}%`:''}</div>`;
    }).join('')}</div><div class="muted" style="margin:4px 0 8px;">比率は維持費（${yen(running)}）に対する割合${gs.some(x=>x.g==='init')?'。初期費用は含めない':''}</div>` : '';
  const open = state.bdOpen || (state.bdOpen = {});
  $('home-breakdown').innerHTML = bar + `<table class="tbl"><tr><th>区分</th><th class="num">件数</th><th class="num">金額</th><th class="num">比率</th></tr>` +
    gs.map(x=>`<tr class="grp" onclick="state.bdOpen['${x.g}']=!state.bdOpen['${x.g}'];renderHome()"><td><span class="tw">${open[x.g]?'▾':'▸'}</span><i class="gdot" style="background:var(--c-${x.g})"></i>${x.name}</td><td class="num">${x.n}</td><td class="num">${yen(x.amount)}</td><td class="num">${x.g==='init'?'':pct(x.amount)}</td></tr>` +
      (open[x.g] ? x.items.map(r=>`<tr class="sub"><td>${esc(r.cat)}</td><td class="num">${r.n}</td><td class="num">${yen(r.amount)}</td><td class="num">${x.g==='init'?'':pct(r.amount)}</td></tr>`).join('') : '')).join('') +
    `<tr class="total"><td>維持費 計</td><td class="num">${entries.filter(e=>!e.initial).length}</td><td class="num">${yen(running)}</td><td class="num">${running?'100%':''}</td></tr>` +
    (running!==total ? `<tr class="total"><td>総額（初期費用含む）</td><td class="num">${entries.length}</td><td class="num">${yen(total)}</td><td class="num"></td></tr>` : '') + `</table>`;
}

function renderReminders(){
  const today = todayStr(), cur = currentOdo();
  const items = [];
  // メンテ：区分ごとに最新の記録の次回予定のみ
  const latest = {};
  V.maint.slice().sort(byDateDesc).forEach(m=>{ const k=m.category||'その他'; if(!latest[k]) latest[k]=m; });
  Object.values(latest).forEach(m=>{
    if(!m.nextDate && num(m.nextOdo)==null) return;
    const days = m.nextDate ? daysBetween(today, m.nextDate) : null;
    const km = num(m.nextOdo)!=null && cur ? num(m.nextOdo)-cur.odo : null;
    items.push({kind:'maint', id:m.id, title:m.category + (m.title?`（${m.title}）`:''), date:m.nextDate, odo:num(m.nextOdo), days, km});
  });
  V.costs.forEach(c=>{
    if(!c.until) return;
    const newer = V.costs.some(o=>o!==c && o.category===c.category && o.until && o.until>c.until);
    if(newer) return;
    items.push({kind:'cost', id:c.id, title:c.category + (c.title?`（${c.title}）`:'') + ' 期限', date:c.until, days:daysBetween(today,c.until), km:null});
  });
  const score = it => Math.min(it.days ?? 1e9, it.km!=null ? it.km/30 : 1e9);
  items.sort((a,b)=>score(a)-score(b));
  $('home-remind').innerHTML = items.length ? items.map(it=>{
    const over = (it.days!=null && it.days<0) || (it.km!=null && it.km<0);
    const soon = !over && ((it.days!=null && it.days<=30) || (it.km!=null && it.km<=500));
    const cls = over ? 'due-over' : soon ? 'due-soon' : 'due-ok';
    const parts = [];
    if(it.days!=null) parts.push(it.days<0 ? `${-it.days}日超過` : `あと${it.days}日`);
    if(it.km!=null) parts.push(it.km<0 ? `${fmt(-it.km)}km超過` : `あと${fmt(it.km)}km`);
    const sub = [it.date, it.odo!=null?fmt(it.odo)+' km':''].filter(Boolean).join(' / ');
    return `<div class="remind" onclick="${it.kind==='maint'?'openMaintSheet':'openCostSheet'}('${it.id}')"><div class="rm-left"><div>${esc(it.title)}</div><div class="rm-sub">${sub}</div></div><div class="rm-due ${cls}">${parts.join(' / ')}</div></div>`;
  }).join('') : '<div class="muted">メンテナンスの「次回予定」や費用の「期限」を入力すると表示されます</div>';
}

/* ---------- 給油 ---------- */
function renderFuel(){
  const fs = calcFuelStats();
  const list = V.fuel.filter(f=>inYear(f.date)).sort(byDateDesc);
  let km=0,l=0,cost=0,liters=0;
  list.forEach(f=>{ const r=fs[f.id]; if(r&&r.eco){km+=r.segKm;l+=r.segL;} cost+=num(f.total)||0; liters+=num(f.liters)||0; });
  const ecos = list.map(f=>fs[f.id]?.eco).filter(Boolean);
  const priced = list.filter(f=>num(f.liters) && num(f.total));
  const avgPrice = priced.length ? priced.reduce((s,f)=>s+num(f.total),0)/priced.reduce((s,f)=>s+num(f.liters),0) : null;
  $('fuel-kpi').innerHTML =
    kpi('平均燃費', l?fmt(km/l,2):'—', 'km/L', ecos.length?`最高 ${fmt(Math.max(...ecos),1)} / 最低 ${fmt(Math.min(...ecos),1)}`:'') +
    kpi('給油回数', list.length, '回', `${fmt(liters,1)} L`) +
    kpi('燃料費', yen(cost), '', km ? `${fmt(cost/km,1)} 円/km` : '') +
    kpi('平均単価', avgPrice?fmt(avgPrice,1):'—', '円/L');

  const chartPts = list.slice().reverse().filter(f=>fs[f.id]?.eco).map(f=>{ const r=fs[f.id]; return {v:r.eco, km:r.segKm, l:r.segL, date:f.date, label:f.date.slice(5).replace('-','/')}; });
  lineChart($('fuel-chart'), $('fuel-chart-tip'), chartPts);

  $('fuel-list').innerHTML = groupedList(list, f=>{
    const r = fs[f.id] || {};
    const sub = [num(f.odo)!=null?`ODO ${fmt(num(f.odo))}`:'', r.dist!=null?`+${fmt(r.dist)}km`:'', f.station].filter(Boolean).join(' · ');
    return `<div class="row" onclick="openFuelSheet('${f.id}')">${dateCell(f.date)}
      <div class="r-main"><div class="r-title">${f.full?'':'<span class="badge fuel">部分</span>'}${fmt(num(f.liters),2)} L <span class="muted">@${fmt(num(f.unitPrice),1)}円</span>${f.fuelType && f.fuelType!==(V.info.fuelType||'レギュラー') ? ` <span class="badge">${esc(f.fuelType)}</span>` : ''}</div><div class="r-sub">${esc(sub)}</div></div>
      <div class="r-right"><div class="r-amt">${yen(num(f.total))}</div><div class="r-amt2">${r.eco?fmt(r.eco,2)+' km/L':''}</div></div></div>`;
  }, g=>yen(g.reduce((s,f)=>s+(num(f.total)||0),0)));
}

function openFuelSheet(id){
  const f = id ? V.fuel.find(x=>x.id===id) : null;
  const last = V.fuel.slice().sort(byDateDesc)[0];
  const v = f || {date:todayStr(), odo:'', liters:'', unitPrice: last?.unitPrice||'', total:'', full:true, fuelType: V.info.fuelType||'レギュラー', station: last?.station||'', memo:''};
  openSheet(f?'給油を編集':'給油を記録', `
    <div class="fld-row">
      <div class="fld"><label>日付</label><input type="date" id="f-date" value="${esc(v.date)}"></div>
      <div class="fld"><label>ODO（km）</label><input type="text" inputmode="decimal" id="f-odo" value="${esc(v.odo)}" placeholder="${currentOdo()?fmt(currentOdo().odo):''}"></div>
    </div>
    <div id="f-preview" class="preview"></div>
    <div class="fld-row">
      <div class="fld"><label>給油量（L）</label><input type="text" inputmode="decimal" id="f-liters" value="${esc(v.liters)}"></div>
      <div class="fld"><label>単価（円/L）</label><input type="text" inputmode="decimal" id="f-price" value="${esc(v.unitPrice)}"></div>
    </div>
    <div class="fld"><label>金額（円）</label><input type="text" inputmode="numeric" id="f-total" value="${esc(v.total)}"><div class="hint">給油量×単価で自動計算。金額を入力すると単価を逆算</div></div>
    <div class="fld"><label class="check"><input type="checkbox" id="f-full" ${v.full?'checked':''}>満タン給油（燃費計算に使用）</label></div>
    <div class="fld-row">
      <div class="fld"><label>スタンド</label><input type="text" id="f-station" value="${esc(v.station)}" list="f-station-list">${suggestHtml('f-station', topStations(10))}</div>
    </div>
    <div class="fld"><label>メモ</label><input type="text" id="f-memo" value="${esc(v.memo)}"></div>
  `, () => {
    const rec = { id: f?.id || uid(), date:$('f-date').value, odo:$('f-odo').value.trim(), liters:$('f-liters').value.trim(),
      unitPrice:$('f-price').value.trim(), total:$('f-total').value.trim(), full:$('f-full').checked,
      fuelType: v.fuelType || V.info.fuelType || 'レギュラー',   // 油種は車両情報で設定（既存記録は元の値を維持）
      station:$('f-station').value.trim(), memo:$('f-memo').value.trim() };
    if(!rec.date) return '日付を入力してください';
    if(!num(rec.liters)) return '給油量を入力してください';
    if(!num(rec.total) && num(rec.unitPrice)) rec.total = String(Math.round(num(rec.liters)*num(rec.unitPrice)));
    upsert(V.fuel, rec);
  }, f ? () => remove(V.fuel, f.id) : null);

  const L=$('f-liters'), P=$('f-price'), T=$('f-total');
  const calcTotal = () => { if(num(L.value) && num(P.value)){ T.value = Math.round(num(L.value)*num(P.value)); fmtNumInput(T); } };
  L.oninput = () => { calcTotal(); fuelPreview(f); };
  P.oninput = calcTotal;
  T.oninput = () => { if(num(L.value) && num(T.value)) P.value = (num(T.value)/num(L.value)).toFixed(1); };
  $('f-odo').oninput = () => fuelPreview(f);
  $('f-date').oninput = () => fuelPreview(f);
  fuelPreview(f);
}
// よく使う値（2回以上登録したもの、回数の多い順）: スタンド・メンテの店舗
function topValues(list, key, n){
  const c = {};
  list.forEach(r=>{ const s=(r[key]||'').trim(); if(s) c[s]=(c[s]||0)+1; });
  return Object.keys(c).filter(k=>c[k]>=2).sort((a,b)=>c[b]-c[a]).slice(0,n);
}
const topStations = n => topValues(V.fuel, 'station', n);
// 入力欄の候補（datalist）＋上位3件のボタン
function suggestHtml(inputId, vals){
  return `<datalist id="${inputId}-list">${vals.slice(0,10).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>` +
    (vals.length ? `<div class="chips" style="margin-top:6px;margin-bottom:0;">${vals.slice(0,3).map(x=>`<button type="button" class="chip" onclick="$('${inputId}').value=this.textContent">${esc(x)}</button>`).join('')}</div>` : '');
}
function fuelPreview(f){
  const odo = num($('f-odo').value), el = $('f-preview');
  const prevs = V.fuel.filter(x=>x!==f && num(x.odo)!=null && (odo==null ? x.date<=$('f-date').value : num(x.odo)<odo)).sort((a,b)=>num(b.odo)-num(a.odo));
  const prev = prevs[0];
  if(!prev){ el.innerHTML = '前回の給油記録なし'; return; }
  let html = `前回 ${prev.date} / ODO ${fmt(num(prev.odo))} km`;
  if(odo!=null){
    const d = odo - num(prev.odo);
    html += `<br>→ 走行 <b>${fmt(d)} km</b>`;
    const lastFull = prevs.find(x=>x.full);
    const lit = num($('f-liters').value);
    if(lastFull && lit && $('f-full').checked){
      const between = prevs.filter(x=>num(x.odo)>num(lastFull.odo)).reduce((s,x)=>s+(num(x.liters)||0),0);
      const eco = (odo-num(lastFull.odo))/(between+lit);
      if(eco>0) html += ` / 燃費 <b>${fmt(eco,2)} km/L</b>`;
    }
    if(d<0) html += ' <span class="due-over">（前回より小さい値です）</span>';
  }
  el.innerHTML = html;
}

/* ---------- ODO ---------- */
function renderOdo(){
  const pts = odoPoints(), cur = currentOdo();
  $('odo-current').innerHTML = cur ? `${fmt(cur.odo)}<small>km</small>` : '—';
  $('odo-current-sub').textContent = cur ? `${cur.date} 時点` : 'ODOを記録すると表示されます';
  const rng = periodRange();
  const dist = rng ? distBetween(pts, rng.t0, rng.t1) : 0;
  let months = 0;
  if(pts.length>=2){
    const first = dateMs(pts[0].date), last = dateMs(pts[pts.length-1].date);
    const t0 = Math.max(first, rng.t0), t1 = Math.min(last, rng.t1);
    months = Math.max(0,(t1-t0)/86400000/30.44);
  }
  const totalDist = pts.length>=2 ? pts[pts.length-1].odo - pts[0].odo : 0;
  $('odo-kpi').innerHTML =
    kpi(state.year==='all'?'期間走行':'年間走行', fmt(dist), 'km') +
    kpi('月平均', months>=0.5 ? fmt(dist/months) : '—', 'km/月') +
    insKpi(pts) +
    kpi('累計走行', fmt(totalDist), 'km', V.info.initialOdo ? `納車時 ${fmt(num(V.info.initialOdo))} km` : '');

  let labels, ranges;
  if(state.year==='all'){
    const ys = [...new Set(pts.map(p=>p.date.slice(0,4)))].sort();
    labels = ys.map(y=>y.slice(2)+'年'); ranges = ys.map(y=>[new Date(+y,0,1).getTime(), new Date(+y+1,0,1).getTime()]);
    $('odo-chart-title').textContent = '年別走行距離';
  }else{
    const y = +state.year;
    labels = Array.from({length:12},(_,i)=>(i+1)+'月'); ranges = labels.map((_,i)=>[new Date(y,i,1).getTime(), new Date(y,i+1,1).getTime()]);
    $('odo-chart-title').textContent = '月別走行距離';
  }
  if(pts.length>=2 && labels.length) barChart($('odo-chart'), $('odo-chart-tip'), labels, [{name:'走行', color:'--accent', values:ranges.map(r=>distBetween(pts,r[0],r[1]))}], (v,axis)=>axis?fmt(v):fmt(v)+' km');
  else { $('odo-chart').innerHTML='<div class="empty">ODOの記録が2件以上で表示されます</div>'; $('odo-chart-tip').textContent=''; }

  renderCum(pts);

  const srcName = {odo:'手入力', fuel:'給油', maint:'メンテ', init:'納車時'};
  $('odo-filter').innerHTML = [['all','すべて'],['odo','手入力'],['fuel','給油'],['maint','メンテ']].map(([k,n])=>`<button class="chip ${state.odoFilter===k?'active':''}" onclick="state.odoFilter='${k}';render()">${n}</button>`).join('');
  const withDelta = pts.map((p,i)=>({...p, delta: i ? p.odo-pts[i-1].odo : null, days: i ? daysBetween(pts[i-1].date,p.date) : null}));
  const list = withDelta.filter(p=>inYear(p.date) && (state.odoFilter==='all' || p.src===state.odoFilter || p.src==='init' && state.odoFilter==='all')).reverse();
  $('odo-list').innerHTML = groupedList(list, p=>{
    const cls = {odo:'',fuel:'fuel',maint:'maint',init:'cost'}[p.src];
    const click = p.src==='odo' ? `openOdoSheet('${p.id}')` : p.src==='fuel' ? `openFuelSheet('${p.id}')` : p.src==='maint' ? `openMaintSheet('${p.id}')` : 'openVehicleSheet()';
    return `<div class="row" onclick="${click}">${dateCell(p.date)}
      <div class="r-main"><div class="r-title"><span class="badge ${cls}">${srcName[p.src]}</span>${fmt(p.odo)} km</div><div class="r-sub">${esc(p.memo||'')}</div></div>
      <div class="r-right"><div class="r-amt" style="font-size:13px">${p.delta!=null?(p.delta>=0?'+':'')+fmt(p.delta)+' km':''}</div><div class="r-amt2">${p.days?p.days+'日':''}</div></div></div>`;
  }, g=>{ const s=g.reduce((a,p)=>a+(p.delta||0),0); return s?`+${fmt(s)} km`:''; });
}

function openOdoSheet(id){
  const o = id ? V.odo.find(x=>x.id===id) : null;
  const v = o || {date:todayStr(), odo:'', memo:''};
  const cur = currentOdo();
  openSheet(o?'ODOを編集':'ODOを記録', `
    <div class="fld"><label>日付</label><input type="date" id="o-date" value="${esc(v.date)}"></div>
    <div class="fld"><label>ODO（km）</label><input type="text" inputmode="decimal" id="o-odo" value="${esc(v.odo)}" placeholder="${cur?fmt(cur.odo):''}">
      <div class="hint">${cur?`現在の最大値：${fmt(cur.odo)} km（${cur.date}）`:''}</div></div>
    <div class="fld"><label>メモ</label><input type="text" id="o-memo" value="${esc(v.memo)}" placeholder="例：月末記録、旅行 など"></div>
    <div class="muted">給油・メンテナンスで入力したODOも自動でこのログに反映されます</div>
  `, () => {
    const rec = {id:o?.id||uid(), date:$('o-date').value, odo:$('o-odo').value.trim(), memo:$('o-memo').value.trim()};
    if(!rec.date) return '日付を入力してください';
    if(num(rec.odo)==null) return 'ODOを入力してください';
    upsert(V.odo, rec);
  }, o ? () => remove(V.odo, o.id) : null);
}

/* ---------- メンテナンス ---------- */
function renderMaint(){
  // 履歴は全期間（選択年以外は薄く表示）、カードは選択年で集計
  const hist = V.maint.filter(m=>state.maintFilter==='all' || m.category===state.maintFilter).sort(byDateDesc);
  const list = hist.filter(m=>inYear(m.date));
  const all = V.maint.filter(m=>inYear(m.date));
  const total = list.reduce((s,m)=>s+(num(m.cost)||0),0);
  const wash = all.filter(m=>/洗車/.test(m.category||'')).length;
  const lastOil = V.maint.filter(m=>m.category==='オイル交換').sort(byDateDesc)[0];
  const cur = currentOdo();
  const sinceKm = m => m && num(m.odo)!=null && cur ? `以降 ${fmt(cur.odo-num(m.odo))} km` : '';
  const shortDate = m => m ? m.date.slice(2).replace(/-/g,'/') : '—';
  if(state.maintFilter==='all'){
    $('maint-kpi').innerHTML =
      kpi('件数', list.length, '件') +
      kpi('費用', yen(total)) +
      kpi('洗車回数', wash, '回') +

// 「○カ月」（1年以上は「○年○カ月」、1カ月未満は「○日」）
function monthsBetween(a, b){
  const [y1,m1,d1]=a.split('-').map(Number), [y2,m2,d2]=b.split('-').map(Number);
  let n = (y2-y1)*12 + (m2-m1); if(d2<d1) n--;
  if(n<1) return `${daysBetween(a,b)}日`;
  return n>=12 ? `${Math.floor(n/12)}年${n%12?n%12+'カ月':''}` : `${n}カ月`;
}

// 次回予定を「前回の同じ区分の記録で設定した間隔」と同じにする（前回に予定が無ければ空欄）
function nextLikePrev(rec){
  const prev = V.maint.filter(x=>x!==rec && x.category===rec.category && x.date<=rec.date && (x.nextDate || num(x.nextOdo)!=null)).sort(byDateDesc)[0];
  const r = {nextDate:'', nextOdo:''};
  if(!prev) return r;
  if(prev.nextDate){
    const [py,pm,pd] = prev.date.split('-').map(Number), [ny,nm,nd] = prev.nextDate.split('-').map(Number), [ry,rm,rd] = rec.date.split('-').map(Number);
    // 前回が「○カ月後の同じ日」なら月単位で、そうでなければ日数で同じ間隔
    const d = pd===nd ? new Date(ry, rm-1 + (ny-py)*12 + (nm-pm), rd) : new Date(dateMs(rec.date) + (dateMs(prev.nextDate) - dateMs(prev.date)));
    r.nextDate = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  if(num(prev.nextOdo)!=null && num(prev.odo)!=null && num(rec.odo)!=null) r.nextOdo = String(num(rec.odo) + (num(prev.nextOdo) - num(prev.odo)));
  return r;
}

// 平均の分母にする月数: 選択期間のうち、納車日（未設定なら最初の記録）から今日までの範囲
function periodMonths(list){
  const rng = periodRange(); if(!rng) return 1;
  const firstRec = list.map(x=>x.date).filter(Boolean).sort()[0];
  const startD = V.info.purchaseDate || firstRec;
  const start = Math.max(rng.t0, startD ? dateMs(startD) : rng.t0);
  const end = Math.min(rng.t1, dateMs(todayStr()) + 86400000);
  return Math.max(1, Math.round((end-start)/86400000/30.44));
}
function renderCost(){
  // 履歴は全期間（選択年以外は薄く表示）、カードは選択年で集計
  const all = V.costs.filter(c=>inYear(c.date));
  const hist = V.costs.filter(c=>state.costFilter==='all' || c.category===state.costFilter).sort(byDateDesc);
  const list = hist.filter(c=>inYear(c.date));
  const total = list.reduce((s,c)=>s+(num(c.amount)||0),0);
  if(state.costFilter==='all'){
    // すべて: 合計＋金額の多い区分の上位3つ
    const byCat = {};
    all.forEach(c=>{ byCat[c.category] = (byCat[c.category]||0) + (num(c.amount)||0); });
    const top = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,3);
    $('cost-kpi').innerHTML = kpi('合計', yen(total), '', `${list.length}件`) +
      top.map(([c,a])=>kpi(esc(c), yen(a), '', total ? `${fmt(a/total*100,0)}%` : '')).join('');
  }else{
    // 区分で絞り込み中: 合計・件数・1件平均・月平均（全期間で1年以上なら年平均）
    const months = periodMonths(list);
    const avg = months>=12 && state.year==='all' ? ['年平均', total/(months/12)] : ['月平均', total/Math.max(1,months)];
    $('cost-kpi').innerHTML =
      kpi('合計', yen(total)) +
      kpi('件数', list.length, '件') +
      kpi('1件平均', list.length ? yen(total/list.length) : '—') +
      kpi(avg[0], list.length ? yen(avg[1]) : '—');
  }
  const used = [...new Set(V.costs.map(c=>c.category))];
  const cats = D.costCats.filter(c=>used.includes(c)).concat(used.filter(c=>!D.costCats.includes(c)));
  $('cost-filter').innerHTML = chipsHtml(cats, state.costFilter, 'costFilter');
  $('cost-list').innerHTML = groupedList(hist, c=>{
    const sub = [c.until?`期限 ${c.until}`:'', c.memo].filter(Boolean).join(' · ');
    return `<div class="row ${inYear(c.date)?'':'dim'}" onclick="openCostSheet('${c.id}')">${dateCell(c.date)}

      <div class="r-right"><div class="r-amt">${yen(num(c.amount))}</div></div></div>`;
  }, g=>yen(g.reduce((s,c)=>s+(num(c.amount)||0),0)));
}
