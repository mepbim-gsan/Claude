    ${V.info.purchaseDate?'':'<div class="muted due-soon">車両情報の納車日が未設定のため、年別の集計には含まれません（全期間のみ）</div>'}
  `, () => {
    const rec = {id:c?.id||uid(), category:$('i-cat').value, title:$('i-title').value.trim(), amount:$('i-amount').value.trim(), memo:$('i-memo').value.trim()};
    if(!num(rec.amount)) return '金額を入力してください';
    upsert(V.initCosts, rec);
    setTimeout(openInitList, 0);   // 保存後は明細一覧に戻る
  }, c ? () => { remove(V.initCosts, c.id); setTimeout(openInitList, 0); } : null);
}
const CAT_RECORDS = {maintCats:()=>D.vehicles.flatMap(v=>v.maint), costCats:()=>D.vehicles.flatMap(v=>v.costs), initCats:()=>D.vehicles.flatMap(v=>v.initCosts)};
function addCat(key){ D[key].push('新しい区分'); saveData(); render(); }
function renameCat(key,i,val){
  val = val.trim(); if(!val) { render(); return; }
  const old = D[key][i]; D[key][i] = val;
  const arr = CAT_RECORDS[key]();
  arr.forEach(r=>{ if(r.category===old) r.category=val; });
  saveData(); render();
}
function moveCat(key,i,d){ const a=D[key]; [a[i],a[i+d]]=[a[i+d],a[i]]; saveData(); render(); }
function delCat(key,i){
  const arr = CAT_RECORDS[key]();
  const n = arr.filter(r=>r.category===D[key][i]).length;
  if(!confirm(`「${D[key][i]}」を削除しますか？` + (n?`\n（使用中の記録 ${n}件は区分名がそのまま残ります）`:''))) return;
  D[key].splice(i,1); saveData(); render();
}
function setTheme(t){ document.documentElement.dataset.theme=t; try{localStorage.setItem(THEME_KEY,t);}catch{} render(); }
function exportJson(){
  const blob = new Blob([JSON.stringify({app:'carlog', version:APP_VERSION, exportedAt:new Date().toISOString(), data:D}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `carlog_${todayStr()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importJson(input){
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(r.result); const d = j.data || j;
      if(!Array.isArray(d.fuel) && !Array.isArray(d.vehicles)) throw 0;
      if(!confirm('現在のデータを置き換えて復元しますか？')) return;
      D = migrate(d); syncV(); saveData(); render(); toast('復元しました');
    }catch{ toast('読み込めないファイルです'); }
    input.value='';
  };
  r.readAsText(file);
}
function clearAll(){
  if(!confirm('すべての記録と設定を削除しますか？（元に戻せません）')) return;
  D = emptyData(); syncV(); saveData(); render(); toast('削除しました');
}
// サンプル車（日付は今日基準で生成）
function buildSample(){
  const d = newVehicle();
  d.sample = true;
  const y = new Date().getFullYear(), today = todayStr();
  const Y0 = y-4;                                   // 約4年前の4月に納車
  const ymd = t => t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const at = (yy,mm,dd) => ymd(new Date(yy,mm-1,dd));
  d.info = {name:'サンプル', model:'コンパクトSUV', year:String(Y0), purchaseDate:at(Y0,4,10), initialOdo:'12', fuelType:'レギュラー', tankCapacity:'45', color:'#a8adb7'};
  [['車両本体','',2650000],['値引き','',-150000],['環境性能割','',27000],['自動車重量税','3年分',24600],['自賠責保険','37ヶ月',24190],['自動車税（月割）','',23000],['リサイクル料金','',11000],['登録・納車費用','',60000],['オプション・付属品','ナビ・ETC・マット',280000],['コーティング','ガラスコーティング',66000]]
    .forEach(([c,t,a])=>d.initCosts.push({id:uid(), category:c, title:t, amount:String(a), memo:''}));

  // 給油（12〜20日ごと、約9,000km/年）・洗車
  let odo = 12, t = new Date(Y0,3,20), i = 0;
  const end = new Date();
  while(t < end){
    odo += 380 + Math.round(Math.random()*180);
    const liters = (odo % 7 === 0) ? 18 + Math.random()*5 : 30 + Math.random()*8;
    const price = 160 + Math.round(Math.random()*16);
    const ds = ymd(t);
    d.fuel.push({id:uid(), date:ds, odo:String(odo), liters:liters.toFixed(2), unitPrice:String(price), total:String(Math.round(liters*price)), full: odo % 7 !== 0, fuelType:'レギュラー', station:i%3?'セルフA':'B石油', memo:''});
    if(i%3===1){   // 洗車: 洗車機 / 自宅で手洗い（0円）/ ときどき専門店
      const [title, cost, shop] = i%24===1 ? ['手洗い（専門店）','3300','洗車専門店'] : i%6===4 ? ['手洗い','','自宅'] : ['洗車機','800','セルフA'];
      d.maint.push({id:uid(), date:ds, odo:String(odo), category:'洗車', title, cost, shop, memo:'', nextDate:'', nextOdo:''});
    }
    t = new Date(t.getTime() + (12+Math.round(Math.random()*8))*86400000); i++;
  }
  // メンテのODOは給油記録から日付で補間（グラフ上で点がずれないように）
  const fp = [{date:d.info.purchaseDate, odo:12}, ...d.fuel.map(f=>({date:f.date, odo:+f.odo}))];
  const odoOn = ds => String(Math.round(odoAt(fp, dateMs(ds))));
  for(let m=new Date(Y0,4,28); m.getTime()<=dateMs(fp[fp.length-1].date); m.setMonth(m.getMonth()+1)){
    const ds = ymd(m); d.odo.push({id:uid(), date:ds, odo:odoOn(ds), memo:'月末記録'});
  }
  const M = [];   // [日付, 区分, 内容, 費用, 店舗, 次回予定日, 次回ODO加算, メモ]
  // 法定点検・車検（新車: 初回車検3年、以後2年ごと。車検のない年は12ヶ月点検）
  for(let k=1;k<=6;k++){
    const yy = Y0+k, ds = at(yy,4,5);
    if(k===3 || k===5) M.push([ds,'車検', k===3?'初回車検（24ヶ月点検含む）':'車検（24ヶ月点検含む）','52800','ディーラー', at(yy+2,4,9), 0, '整備・代行料・印紙代（重量税・自賠責は費用に記録）']);
    else M.push([ds,'法定点検','12ヶ月点検','15400','ディーラー','',0,'']);
  }
  // オイル交換（半年ごと）・フィルター（1年ごと）
  for(let k=0;k<12;k++){
    const dt = new Date(Y0,4+k*6,15);
    M.push([ymd(dt),'オイル交換','0W-20 4L','5500','ディーラー', ymd(new Date(Y0,4+(k+1)*6,15)), 6000,'']);
    if(k%2===1) M.push([ymd(dt),'オイルフィルター','','1650','ディーラー','',0,'']);
  }
  // 季節・消耗品・カスタム・修理
  for(let yy=Y0; yy<=y; yy++){
    M.push([at(yy,11,20),'タイヤ','スタッドレスに交換','4400','カー用品店','',0,'']);
    M.push([at(yy+1,4,2),'タイヤ','夏タイヤに交換','4400','カー用品店','',0,'']);
    M.push([at(yy,6,20),'消耗品','ワイパーゴム交換','2800','カー用品店','',0,'']);
    if(yy>Y0) M.push([at(yy,5,10),'コーティング','メンテナンス','11000','専門店', at(yy+1,5,10),0,'']);
  }
  M.push([at(Y0,11,10),'タイヤ','スタッドレスタイヤ購入（ホイール付）','98000','カー用品店','',0,'']);
  M.push([at(Y0+1,6,1),'カスタム','ドラレコ取付','38000','カー用品店','',0,'']);
  M.push([at(Y0+2,9,12),'修理','バンパー擦り傷補修','27500','板金工場','',0,'駐車場で擦った']);
  M.push([at(Y0+3,10,8),'バッテリー','バッテリー交換','18700','カー用品店','',0,'']);
  M.push([at(Y0+4,7,3),'カスタム','フロアマット交換','15800','通販','',0,'']);
  M.push([at(Y0,4,20),'その他','車内用ゴミ箱','1980','カー用品店','',0,'']);
  M.push([at(Y0+2,3,15),'その他','芳香剤','880','カー用品店','',0,'']);
  M.push([at(Y0+3,10,1),'その他','洗車用シャンプー・クロス','2480','カー用品店','',0,'']);
  M.filter(m=>m[0]<=today).forEach(([ds,cat,title,cost,shop,nd,nk,memo])=>{
    const o = odoOn(ds);
    d.maint.push({id:uid(), date:ds, odo:o, category:cat, title, cost, shop, memo, nextDate:nd, nextOdo:nk?String(+o+nk):''});
  });
  // 費用（保険・税金・車検時の法定費用・ロードサービス・高速）
  const C = [];
  for(let yy=Y0; yy<=y; yy++){
    C.push([at(yy,4,10),'任意保険','年間保険料', 68000-(yy-Y0)*5000, at(yy+1,4,9)]);
    if(yy>Y0) C.push([at(yy,5,20),'自動車税（種別割）','',30500,'']);
    C.push([at(yy,6,1),'ロードサービス・会員','年会費',4000, at(yy+1,5,31)]);
    C.push([at(yy,8,12),'高速・有料道路','帰省',8640,'']);
    C.push([at(yy,12,29),'高速・有料道路','年末帰省',9120,'']);
  }
  [3,5].forEach(k=>{
    C.push([at(Y0+k,4,5),'自動車重量税','車検（2年分）',24600,'']);
    C.push([at(Y0+k,4,5),'自賠責保険','車検（24ヶ月）',17650, at(Y0+k+2,4,9)]);
  });
  C.filter(c=>c[0]<=today).forEach(([ds,cat,title,amt,until])=>d.costs.push({id:uid(), date:ds, category:cat, title, amount:String(amt), until:until||'', memo:''}));
  return d;
}
function rebuildSample(){
  if(D.vehicles.some(v=>v.sample) && !confirm('サンプル車を作り直しますか？（サンプル車への変更は消えます）')) return;
  const s = buildSample();
  const i = D.vehicles.findIndex(v=>v.sample);
  if(i>=0) D.vehicles[i] = s; else D.vehicles.push(s);
  switchVehicle(s.id); toast('サンプル車を作り直しました');
}

/* ---------- 共通：シート ---------- */
let _sheetSave = null;
// 数値入力欄: 表示中は3桁区切り、入力中（フォーカス時）は区切りなし。保存前に区切りを除去
function fmtNumInput(el){
  if(document.activeElement === el || el.dataset.nofmt) return;
  const v = el.value.replace(/,/g,'').trim();
  const m = v.match(/^(-?)(\d+)(\.\d*)?$/);
  if(m) el.value = m[1] + Number(m[2]).toLocaleString('en-US') + (m[3]||'');
}
const numInputs = () => document.querySelectorAll('#sh-body input[inputmode=numeric], #sh-body input[inputmode=decimal]');
document.addEventListener('focusin', e=>{
  const el = e.target;
  if(!(el.matches && el.matches('#sh-body input[inputmode]')) || !el.value.includes(',')) return;
  el.value = el.value.replace(/,/g,'');
  el.select();   // 区切りを外した後は全選択（そのまま上書き入力できる）
});
document.addEventListener('focusout', e=>{ if(e.target.matches && e.target.matches('#sh-body input[inputmode]')) setTimeout(()=>fmtNumInput(e.target), 0); });
function openSheet(title, body, onSave, onDelete){
  $('sh-title').textContent = title;
  $('sh-body').innerHTML = body;
  numInputs().forEach(fmtNumInput);
  if(!onSave){
    $('sh-foot').innerHTML = '<button class="btn" onclick="closeSheet()">閉じる</button>';
    $('sheet').classList.add('show'); $('sheet-bg').classList.add('show'); $('sh-body').scrollTop = 0;
    return;
  }
  $('sh-foot').innerHTML = (onDelete?'<button class="btn danger" id="sh-del">削除</button>':'') + '<button class="btn" onclick="closeSheet()">キャンセル</button><button class="btn primary" id="sh-save">保存</button>';
  $('sh-save').onclick = () => {
    numInputs().forEach(el=>{ el.value = el.value.replace(/,/g,''); });
    const err = onSave();
    if(err) numInputs().forEach(fmtNumInput);
    if(err){ toast(err); return; }
    saveData(); closeSheet(); render(); toast('保存しました');
  };
  if(onDelete) $('sh-del').onclick = () => { if(!onDelete.ownConfirm && !confirm('この記録を削除しますか？')) return; if(onDelete()===false) return; saveData(); closeSheet(); render(); toast('削除しました'); };
  $('sheet').classList.add('show'); $('sheet-bg').classList.add('show');
  $('sh-body').scrollTop = 0;
}
function closeSheet(){ $('sheet').classList.remove('show'); $('sheet-bg').classList.remove('show'); }
function upsert(arr, rec){ const i = arr.findIndex(x=>x.id===rec.id); if(i>=0) arr[i]=rec; else arr.push(rec); }
function remove(arr, id){ const i = arr.findIndex(x=>x.id===id); if(i>=0) arr.splice(i,1); }

/* ---------- ナビ ---------- */
const FAB_ACTION = {home:()=>openFuelSheet(), fuel:()=>openFuelSheet(), odo:()=>openOdoSheet(), maint:()=>openMaintSheet(), cost:()=>openCostSheet()};
function onFab(){ FAB_ACTION[state.page]?.(); }
function showPage(p){
  state.page = p;
  document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active', el.id==='page-'+p));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.toggle('active', el.dataset.page===p));
  $('fab').classList.toggle('show', !!FAB_ACTION[p]);
  window.scrollTo(0,0);
  render();
}
function render(){
  const v = V.info;
  const sub = [v.name, v.model].filter(Boolean).join(' ');
  $('h-title').innerHTML = 'CarLog' + `<span class="h-sub">${carIco(v.color,16)} ${esc(sub||'（名称未設定）')} ▾</span>`;
  updateAppIcons();
  renderYearSelects();
  ({home:renderHome, fuel:renderFuel, odo:renderOdo, maint:renderMaint, cost:renderCost, settings:renderSettings})[state.page]();
}
