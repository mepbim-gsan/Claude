name: Copy to OneDrive

on:
  repository_dispatch:
    types: [copy-to-onedrive]
  workflow_dispatch:
    inputs:
      source_path:
        description: 'コピー元パス (例: Timecard または MF_Classify/main.py)'
        required: true
        type: string
      onedrive_parent:
        description: 'OneDrive 親フォルダパス (例: バックアップ/ツール)'
        required: true
        type: string
      tool_name:
        description: 'ツール名 → フォルダ名のベース ({name}_YYYYMMDD)'
        required: true
        type: string

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Copy to OneDrive
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ONEDRIVE_REFRESH_TOKEN: ${{ secrets.ONEDRIVE_REFRESH_TOKEN }}
          SOURCE_PATH: ${{ github.event.client_payload.source_path || inputs.source_path }}
          ONEDRIVE_PARENT: ${{ github.event.client_payload.onedrive_parent || inputs.onedrive_parent }}
          TOOL_NAME: ${{ github.event.client_payload.tool_name || inputs.tool_name }}
        run: python .github/scripts/copy_to_onedrive.py
